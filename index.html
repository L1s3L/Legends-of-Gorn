    if(g[y][x]!=='.')continue;
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=x+dx,ny=y+dy;
      if(nx>=0&&ny>=0&&nx<16&&ny<16&&g[ny][nx]!=='.'&&g[ny][nx]!=='o'){add.push([x,y]);break}

function centerGrid(g){

function buildGrid(it){

    const xs=L.xs;

      const y=15-x;

      if(L.t>=3)setPx(g,x,y+1,'d');

    for(let k=-gl;k<=gl;k++){setPx(g,cx+k,cy+k,'d',true);setPx(g,cx+k+1,cy+k,'m',true)}

    for(let i=0;i<len;i++){setPx(g,cx-1-i,cy+1+i,'1');setPx(g,cx-i,cy+1+i,'2')}
    setPx(g,cx-len,cy+len+1,'g',true);

    const L=BOW_LOOK[it.sub]||BOW_LOOK[__gornT(143)];

    for(let i=0;i<=60;i++){

    for(let y=mid-2;y<=mid+1;y++){const x=Math.round(11-L.amp);for(let k=-1;k<=1;k++)setPx(g,x+k,y,k===0?'2':'1',true)}

    for(let y=0;y<H.length;y++)for(let x=0;x<8;x++){
      const c=H[y][x];if(c==='.')continue;
      setPx(g,x,y,c,true);
      const m=c==='l'?'d':c==='d'?'l':c;
      setPx(g,15-x,y,m,true);
    }
  }
  outlinePass(g);
  g=centerGrid(g);

  if(it.enchCount>0){
    const r=mulberry32(it.seed^0x9e3779b1);

    while(n>0&&tries++<80){

}

const ART={};

function mkc(w,h){const c=document.createElement('canvas');c.width=w||16;c.height=h||16;return c}
function makeSprite(rows,pal){
  const c=mkc(16,16),x=c.getContext('2d');

  return c;
}
function makeCrystalSlimeSprite(rows){
  const c=mkc(16,16),x=c.getContext('2d');
  const mix=(a,b,t)=>{const A=[parseInt(a.slice(1,3),16),parseInt(a.slice(3,5),16),parseInt(a.slice(5,7),16)],B=[parseInt(b.slice(1,3),16),parseInt(b.slice(3,5),16),parseInt(b.slice(5,7),16)];return '#'+A.map((v,j)=>Math.round(v+(B[j]-v)*t).toString(16).padStart(2,'0')).join('')};
  const stops=['#ddfbff','#72ddeb','#4f83d4'];
  for(let y=0;y<16;y++){
    const r=rows[y]||'';
    for(let i=0;i<16;i++){
      const ch=r[i];if(!ch||ch==='.')continue;
      let col;
      if(ch==='o')col='#102338';
      else if(ch==='k')col='#13243a';
      else if(ch==='w')col='#f5ffff';
      else{
        const t=Math.max(0,Math.min(1,(y-6)/8));
        let body=t<.5?mix(stops[0],stops[1],t*2):mix(stops[1],stops[2],(t-.5)*2);
        if(ch==='b')body=mix(body,'#f4ffff',.32);
        if(ch==='d')body=mix(body,'#263b7c',.34);
        const facet=(y===7&&(i===6||i===10))||(y===8&&(i===5||i===11))||(y===9&&i===4);
        col=facet?mix(body,'#f4ffff',.24):body;
      }

    }
  }

}
const SPR_CACHE={};
function art(name,variant){

const TINT_CACHE=new WeakMap(); /* слабые ссылки: тонированные копии освобождаются вместе со спрайтом */
function tinted(c,color){

  x.drawImage(c,0,0);x.globalCompositeOperation='source-in';x.fillStyle=color;x.fillRect(0,0,c.width,c.height);
  return m[color]=o;
}

function makeDungeon(depth){
  const seed=(Math.random()*4294967296)>>>0,R=mulberry32(seed),ri=(a,b)=>a+Math.floor(R()*(b-a+1));

  const rooms=[];

  const mk=(w,h)=>({x:ri(2,W-w-3),y:ri(2,H-h-3),w,h});
  let arena=null;
  if(boss){
    for(let i=0;i<50&&!arena;i++){const r=mk(15,11);r.arena=true;r.shape='rect';rooms.push(r);arena=r}
  }
  const target=boss?ri(6,7):ri(8,11);
  for(let i=0;i<300&&rooms.length<target;i++){
    const w=ri(7,13),h=ri(6,9),r=mk(w,h);
    if(fits(r))rooms.push(r);
  }
  rooms.forEach(r=>{r.cx=r.x+(r.w>>1);r.cy=r.y+(r.h>>1);if(!r.shape)r.shape=(SKP.ell&&R()<.6)?'ell':'rect'});
  rooms.forEach(r=>{
    for(let y=r.y;y<r.y+r.h;y++)for(let x=r.x;x<r.x+r.w;x++){
      if(r.shape==='ell'){const dx=(x+.5-r.x-r.w/2)/(r.w/2),dy=(y+.5-r.y-r.h/2)/(r.h/2);if(dx*dx+dy*dy>1.02+(R()-.5)*.25)continue}
      setT(m,x,y,TL.FLOOR);
    }
  });
  const carve=(a,b)=>{
    let x=a.cx,y=a.cy;const sx=Math.sign(b.cx-x),sy=Math.sign(b.cy-y);
    while(x!==b.cx){setT(m,x,y,0);setT(m,x,y+1,0);x+=sx}
    while(y!==b.cy){setT(m,x,y,0);setT(m,x+1,y,0);y+=sy}
    setT(m,x,y,0);setT(m,x+1,y,0);setT(m,x,y+1,0);setT(m,x+1,y+1,0);
  };
  const order=rooms.slice().sort((a,b)=>a.cx-b.cx);
  for(let i=0;i<order.length-1;i++)carve(order[i],order[i+1]);
  for(let i=0;i<2;i++){const a=rooms[ri(0,rooms.length-1)],b=rooms[ri(0,rooms.length-1)];if(a!==b)carve(a,b)}
  // старт — дальше всего от арены / случайная комната
  const dist=(a,b)=>Math.hypot(a.cx-b.cx,a.cy-b.cy);
  let start;
  if(boss){start=rooms.filter(r=>r!==arena).sort((a,b)=>dist(b,arena)-dist(a,arena))[0]}
  else start=rooms[ri(0,rooms.length-1)];
  start.start=true;
  const exitRoom=boss?arena:rooms.filter(r=>r!==start).sort((a,b)=>dist(b,start)-dist(a,start))[0];
  exitRoom.exit=true;
  // жидкости и колонны
  rooms.forEach(r=>{
    if(r.start||r.arena||r.w<9||r.h<7)return;
    if(SKP.liq&&R()<.55){
      const cx=r.cx+ri(-1,1),cy=r.cy+ri(-1,1),rad=1.6+R()*1.4;
      for(let y=cy-4;y<=cy+4;y++)for(let x=cx-5;x<=cx+5;x++){
        if(x<r.x+2||x>=r.x+r.w-2||y<r.y+2||y>=r.y+r.h-2)continue;
        const dx=x-cx,dy=(y-cy)*1.25;if(dx*dx+dy*dy<=rad*rad&&tileAt(m,x,y)===0)setT(m,x,y,SKP.liq==='lava'?TL.LAVA:TL.WATER);
      }
    }else if(SKP.pil&&r.shape==='rect'){
      [[2,2],[r.w-3,2],[2,r.h-3],[r.w-3,r.h-3]].forEach(([dx,dy])=>setT(m,r.x+dx,r.y+dy,TL.WALL));
    }
  });
  if(arena&&biome===2){for(let i=0;i<4;i++)setT(m,arena.x+3+i*3,arena.y+2,TL.LAVA)}
  const free=(r,avoid)=>{
    for(let i=0;i<60;i++){
      const x=ri(r.x+1,r.x+r.w-2),y=ri(r.y+1,r.y+r.h-2);
      if(tileAt(m,x,y)!==0)continue;
      if(avoid&&avoid.some(a=>Math.abs(a.tx-x)<2&&Math.abs(a.ty-y)<2))continue;
      return{tx:x,ty:y};
    }
    return null;
  };
  const used=[];
  m.start={x:start.cx*TS+8,y:start.cy*TS+8};m.startRoom=start;if(arena)m.arenaRect=arena;
  // выход
  if(boss){
    m.exitTiles=[[arena.cx,arena.y+2],[arena.cx+1,arena.y+2],[arena.cx,arena.y+3],[arena.cx+1,arena.y+3]];
    m.exitPos={x:(arena.cx+1)*TS,y:(arena.y+3)*TS};
  }else{
    let ex=exitRoom.cx,ey=exitRoom.cy;
    if(tileAt(m,ex,ey)!==0){const f=free(exitRoom);if(f){ex=f.tx;ey=f.ty}}
    m.exitTiles=[[ex,ey],[ex+1,ey],[ex,ey+1],[ex+1,ey+1]];
    m.exitTiles.forEach(([x,y])=>setT(m,x,y,TL.CHASM));
    m.exitPos={x:(ex+1)*TS,y:(ey+1)*TS};
    used.push({tx:ex,ty:ey});
  }
  // монстры
  rooms.forEach(r=>{
    if(r.start)return;
    if(r.arena){m.spawns.push({k:'boss',x:r.cx*TS+8,y:(r.cy+1)*TS+8});return}
    const n=Math.min(7,ri(2,4)+Math.floor(depth/6));
    for(let i=0;i<n;i++){
      const f=free(r,used);if(!f)continue;used.push(f);
      m.spawns.push({k:'mob',x:f.tx*TS+8,y:f.ty*TS+8,elite:R()<Math.min(.16,.05+depth*.006)});
    }
  });
  // сундуки
  const cand=rooms.filter(r=>!r.start&&!r.arena);
  const nCh=Math.max(2,Math.round(cand.length/3));
  const pool=cand.slice().sort(()=>R()-.5);
  for(let i=0;i<nCh&&i<pool.length;i++){
    const f=free(pool[i],used);if(!f)continue;used.push(f);
    const roll=R();
    const tier=roll<.04+depth*.004?2:roll<.28?1:0;
    m.chests.push({x:f.tx*TS+8,y:f.ty*TS+8,tier});
  }
  // факелы
  rooms.forEach(r=>{
    const c=[];
    for(let x=r.x-1;x<=r.x+r.w;x++)for(let y=r.y-1;y<=r.y+r.h;y++){
      if(tileAt(m,x,y)===1&&tileAt(m,x,y+1)===0&&tileAt(m,x,y-1)===1)c.push([x,y]);
    }
    for(let i=0;i<2&&c.length;i++){const k=ri(0,c.length-1),[x,y]=c.splice(k,1)[0];m.decor.push({x:x*TS+8,y:y*TS+6,k:'torch',tx:x,ty:y})}
  });
  // кости и мох
  rooms.forEach(r=>{for(let i=0;i<2;i++){const f=free(r);if(f&&R()<.6)m.decor.push({x:f.tx*TS+8,y:f.ty*TS+9,k:'bones',v:ri(0,2)})}});
  m.rooms=rooms.map(r=>({cx:r.cx,cy:r.cy,w:r.w,h:r.h,x:r.x,y:r.y,start:!!r.start,arena:!!r.arena,exit:!!r.exit}));
  return m;
}

function blockedAt(x,y,r){
  const M=G.map;
  return solidPx(M,x-r,y-r)||solidPx(M,x+r,y-r)||solidPx(M,x-r,y+r)||solidPx(M,x+r,y+r);
}
function unstick(m){
  const r=m.r*.8;
  if(!blockedAt(m.x,m.y,r))return;
  for(let rad=4;rad<=56;rad+=4)for(let a=0;a<12;a++){const nx=m.x+Math.cos(a/12*6.283)*rad,ny=m.y+Math.sin(a/12*6.283)*rad;if(!blockedAt(nx,ny,r)){m.x=nx;m.y=ny;return}}
}
/* ТЕМП БОЯ: множители скорости (1 = как раньше) */
const PACE={mon:1.2,boss:1.1,cd:1.25,proj:1.15,player:1.15,atk:1.12};
function moveEnt(e,dx,dy,pass){
  if(e.k&&e.d){const k=e.boss?PACE.boss:PACE.mon;dx*=k;dy*=k}
  if(pass){e.x+=dx;e.y+=dy;return}
  const r=e.r*.8;
  if(e===P&&P.jump&&gornMoveJump(e,dx,dy,r))return;
  if(!blockedAt(e.x+dx,e.y,r))e.x+=dx;
  if(!blockedAt(e.x,e.y+dy,r))e.y+=dy;
}
function los(x0,y0,x1,y1){
  const dx=x1-x0,dy=y1-y0,n=Math.ceil(Math.hypot(dx,dy)/5);
  for(let i=1;i<n;i++)if(solidPx(G.map,x0+dx*i/n,y0+dy*i/n))return false;
  return true;
}
function computeFlow(){
  const M=G.map,w=M.w,f=G.flow&&G.flow.length===w*M.h?G.flow:(G.flow=new Int16Array(w*M.h));
  f.fill(-1);
  const sx=Math.floor(P.x/TS),sy=Math.floor(P.y/TS);
  if(sx<0||sy<0||sx>=w||sy>=M.h)return;
  const q=[sy*w+sx];f[q[0]]=0;
  for(let h=0;h<q.length;h++){
    const c=q[h],x=c%w,y=(c/w)|0,d=f[c];
    if(d>=45)continue;
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=w||ny>=M.h)continue;
      const i=ny*w+nx;if(f[i]!==-1)continue;
      const t=M.t[i];if(SOLID[t]||t===TL.LAVA)continue;
      f[i]=d+1;q.push(i);
    }
  }
}
function flowDir(m){
  const M=G.map,w=M.w,f=G.flow;if(!f)return null;
  const tx=Math.floor(m.x/TS),ty=Math.floor(m.y/TS),cur=f[ty*w+tx];
  if(cur<0)return null;
  let best=cur,bx=0,by=0;
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
    if(!dx&&!dy)continue;
    const nx=tx+dx,ny=ty+dy;if(nx<0||ny<0||nx>=w||ny>=M.h)continue;
    const v=f[ny*w+nx];if(v<0||v>=best)continue;
    if(dx&&dy&&(SOLID[tileAt(M,tx+dx,ty)]||SOLID[tileAt(M,tx,ty+dy)]))continue;
    best=v;bx=dx;by=dy;
  }
  if(!bx&&!by)return null;
  return{x:(tx+bx)*TS+8-m.x,y:(ty+by)*TS+8-m.y};
}
function steer(m,dt,tx,ty,sp,away){
  let dx=tx-m.x,dy=ty-m.y;
  if(!away&&!m.d.pass&&!los(m.x,m.y,tx,ty)){const f=flowDir(m);if(f){dx=f.x;dy=f.y}}
  let d=Math.hypot(dx,dy)||1;
  if(!away&&!m.boss&&d<110&&d>14&&los(m.x,m.y,tx,ty)){ /* змейкой, а не по линейке */
    m.ph0=m.ph0===undefined?rnd(0,6.28):m.ph0;
    const wv=Math.sin(m.t*3.6+m.ph0)*.6*Math.min(1,(110-d)/55),nx=dx/d,ny=dy/d;
    dx=nx-ny*wv;dy=ny+nx*wv;d=Math.hypot(dx,dy)||1;
  }
  const s=(away?-1:1)*sp*dt/d;
  moveEnt(m,dx*s,dy*s,m.d.pass);
}

function shoot(from,x,y,ang,speed,dmg,o){

function updProjs(dt){
  for(let i=G.projs.length-1;i>=0;i--){
    const p=G.projs[i];
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;
    let kill=p.life<=0;
    if(solidPx(G.map,p.x,p.y)){kill=true;burst(p.x,p.y,p.type==='arrow'?'#c8b080':'#ffa050',4,40)}
    else if(p.from==='p'){
      for(const m of G.mons){
        if(m.dead||p.hit.indexOf(m)>=0)continue;
        if(p.refl&&Math.hypot(m.x-P.x,m.y-P.y)<=3*TS)continue; /* отбитый снаряд не трогает врагов ближе 3 блоков */
        if(Math.hypot(m.x-p.x,m.y-p.y)<m.r+p.r+1){
          p.hit.push(m);
          if(m.aff==='rob'){if(!(m.dodgeT>0)){m.dodgeT=.5;addText(m.x,m.y-m.r*m.scale-4,__gornT(506),'#6ad6c0')}continue}
          const crit=Math.random()<(p.crit||0)/100;
          hurtMon(m,p.dmg*(crit?2:1)*(p.refl&&m.boss?.125:1),{crit,kx:p.vx,ky:p.vy,fire:p.fire,ranged:true});
          if(p.pierce>0){p.pierce--}else{kill=true;break}
        }
      }
    }else if(!p.refl){
      if(!P.jump&&Math.hypot(P.x-p.x,P.y-p.y)<P.r+p.r+1){
        hurtPlayer(p.dmg,p.x,p.y,{fire:p.type==='fire',slow:p.type==='ice',rng:1,mon:p.mon||null});kill=true;
      }
    }
    if(kill&&p.boom)boomFx(p.x-p.vx*dt,p.y-p.vy*dt);
    if(kill)G.projs.splice(i,1);
  }
}

function tierUpMat(t,m){
  if(!(DF.m.tierUp>0)||Math.random()>=DF.m.tierUp)return m;
  const bow=t==='bow',f=t==='sword'?'sword':'armor',src=bow?WOODS:MATS,cur=src[m];
  if(!cur)return m;
  let nt=1e9;
  for(const k in src){if(!bow&&!src[k][f])continue;const tr=src[k].tier;if(tr>cur.tier&&tr<nt)nt=tr}
  if(nt===1e9)return m;
  const c=[];for(const k in src){if(!bow&&!src[k][f])continue;if(src[k].tier===nt)c.push(k)}
  return c[(Math.random()*c.length)|0]||m;
}

function hurtPlayer(dmg,sx,sy,o){
  o=o||{};
  if(P.inv>0||P.dash>0||G.dead)return;
  const eff=P.st.def+P.st.tough*2;
  if(!o.raw)dmg*=20/(20+eff);
  if(o.fire)dmg*=1-P.st.fireRes/100;
  if(o.rng&&P.st.rres)dmg*=1-P.st.rres/100;
  if(o.trap)dmg*=1-P.st.fall/100;
  dmg=Math.max(1,Math.round(dmg));
  P.hp-=dmg;P.inv=.6;P.flash=.15;
  G.fallT=0;
  if(o.slow)P.slowT=2.2;
  if(o.mon&&o.mon.aff==='vamp'){o.mon.hp=Math.min(o.mon.maxHp,o.mon.hp+dmg*2)}
  addText(P.x,P.y-12,'-'+dmg,'#ff6a5a');burst(P.x,P.y,'#d83a3a',6,60);sfx('hurt');G.shake=Math.max(G.shake,3);
  const d=Math.hypot(P.x-sx,P.y-sy)||1;P.kx=(P.x-sx)/d*90;P.ky=(P.y-sy)/d*90;

function updMon(m,dt){

  const am=(G.mods&&G.mods.matk)||1;m.hitCd-=dt*PACE.cd*am;m.cd-=dt*PACE.cd*am*(m.aff==='mg'?2:1);m.flash-=dt;m.stun-=dt;if(m.dazeT>0)m.dazeT-=dt;m.dodgeT=(m.dodgeT||0)-dt;
  if(m.burn>0){

  }

    else{if(d.ai==='ghost')m.alpha=.5;return}
  }else if(dist>300&&!m.boss)m.awake=false;

  if(m.stun>0){if((m.k==='skeleton'||m.d.skel))m.bowDrawState=null;return}

function updMons(dt){
  G.flowT-=dt;
  if(G.flowT<=0&&G.mode==='dungeon'){G.flowT=.3;computeFlow()}
  for(let i=G.mons.length-1;i>=0;i--){const m=G.mons[i];if(m&&!m.dead)updMon(m,dt)}
  /* Spatial buckets avoid the old all-pairs cost when a floor is crowded.
     Candidate indices stay sorted so collision response keeps its old order. */
  const CELL=32,bins=new Map(),key=(x,y)=>x+','+y;
  for(let i=0;i<G.mons.length;i++){
    const m=G.mons[i];if(!m||!m.d||!Number.isFinite(m.x)||!Number.isFinite(m.y))continue;
    const k=key(Math.floor(m.x/CELL),Math.floor(m.y/CELL));let b=bins.get(k);
    if(!b)bins.set(k,b=[]);b.push(i);
  }
  for(let i=0;i<G.mons.length;i++){
    const a=G.mons[i];if(!a||!a.d||a.d.pass||a.d.ai==='ambush'&&a.hidden)continue;
    const cx=Math.floor(a.x/CELL),cy=Math.floor(a.y/CELL),candidates=[];
    for(let oy=-1;oy<=1;oy++)for(let ox=-1;ox<=1;ox++){
      const b=bins.get(key(cx+ox,cy+oy));if(b)for(const j of b)if(j>i)candidates.push(j);
    }
    candidates.sort((u,v)=>u-v);
    for(const j of candidates){
      const b=G.mons[j];if(!b||!b.d||b.d.pass||b.d.ai==='ambush'&&b.hidden)continue;
      const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),min=(a.r+b.r)*.9;
      if(d<min&&d>.01){const p=(min-d)*.15;moveEnt(a,-dx/d*p,-dy/d*p);moveEnt(b,dx/d*p,dy/d*p)}
    }
  }
}

    const h=G.haz[i];h.t-=dt;
    if(h.t<=0){
      burst(h.x,h.y,h.col,14,90);G.shake=Math.max(G.shake,2.5);sfx('boom');
      if(Math.hypot(P.x-h.x,P.y-h.y)<h.r+P.r*.6)hurtPlayer(5+G.depth*.9,h.x,h.y,{fire:G.map.biome===2,src:__gornT(524),mon:h.owner||null});
      G.haz.splice(i,1);
    }
  }
  if(G.mode==='dungeon'&&G.map&&(!G.map.boss||(G.boss&&G.boss.awake))){
    const b=G.map.biome;
    if(b===4||b===2){
      G.hazT=(G.hazT===undefined?3:G.hazT)-dt;
      if(G.hazT<=0){G.hazT=b===4?rnd(2.4,3.6):rnd(4,6);if(G.hazOn)addHaz(P.x+rnd(-48,48),P.y+rnd(-48,48),1.1)}
    }
  }
}

/* ---- Кибернетический элитник: раз в 2 с с шансом 30% телепортируется за спину игрока ---- */
const CY_COLS=(()=>{const a=[],N=20;for(let i=0;i<N;i++){const h=i/(N-1)*280,s=1,l=.55,k=n=>(n+h/30)%12,f=n=>l-s*Math.min(l,1-l)*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));a.push('#'+[f(0),f(8),f(4)].map(v=>Math.round(v*255).toString(16).padStart(2,'0')).join(''))}return a})();
function cyRoom(x,y){const rs=G.map&&G.map.rooms;if(!rs)return null;const tx=Math.floor(x/TS),ty=Math.floor(y/TS);for(const r of rs)if(tx>=r.x&&tx<r.x+r.w&&ty>=r.y&&ty<r.y+r.h)return r;return null}
function cyberTick(m,dt){
  m.cyT=(m.cyT===undefined?2:m.cyT)-dt;
  if(m.cyT>0)return;
  m.cyT+=2;
  if(G.mode!=='dungeon'||m.stun>0||G.dead||P.jump||(G.mods&&G.mods.dread&&m._dread)||Math.random()>=.3)return;
  const rp=cyRoom(P.x,P.y),rm=cyRoom(m.x,m.y),dist=Math.hypot(P.x-m.x,P.y-m.y);
  if(rp||rm){if(rp!==rm)return}else if(dist>170||!los(m.x,m.y,P.x,P.y))return; /* игрок в другой комнате - не телепортируемся */
  const a=Math.atan2(P.y-m.y,P.x-m.x),rr=m.r*.8;
  for(let k=0;k<10;k++){
    const d=rnd(24,40),nx=P.x+Math.cos(a)*d+rnd(-10,10),ny=P.y+Math.sin(a)*d+rnd(-10,10);
    if(blockedAt(nx,ny,rr))continue;
    if(rp&&cyRoom(nx,ny)!==rp)continue;
    if(Math.hypot(nx-P.x,ny-P.y)<P.r+m.r+6)continue;
    const c=art((m.k==='skeleton'||m.d.skel)?'skeleton_archer':m.d.art,m.vr);
    (G.cyTr=G.cyTr||[]).push({x0:m.x,y0:m.y,x1:nx,y1:ny,t0:G.time,mode:G.mode,depth:G.depth,c,sc:m.scale,flip:m.face<0&&m.d.art!=='slime'&&m.d.art!=='ghost',lift:m.d.fly?4:0});
    if(G.cyTr.length>12)G.cyTr.shift();

    m.hitCd=Math.max(m.hitCd||0,.5);m.cd=Math.max(m.cd||0,.5); /* короткая пауза после появления */
    burst(nx,ny,'#a06aff',10,70);sfx('special');

}
function drawCyberTrails(ctx,cx,cy){
  const A=G.cyTr;if(!A||!A.length)return;
  for(let k=A.length-1;k>=0;k--){
    const T=A[k],age=G.time-T.t0;
    if(age>.8||age<0||T.mode!==G.mode||T.depth!==G.depth){A.splice(k,1);continue}
    const fade=1-age/.8,N=CY_COLS.length;
    for(let i=0;i<N;i++){
      const p=i/(N-1),wx=T.x0+(T.x1-T.x0)*p,wy=T.y0+(T.y1-T.y0)*p,sx=wx-cx,sy=wy-cy;
      if(sx<-30||sy<-30||sx>VW+30||sy>VH+30)continue;
      const x=sx-8*T.sc,y=sy-12*T.sc-T.lift;
      sprDraw(ctx,T.c,x,y,T.sc,T.flip,.45*fade);
      sprDraw(ctx,tinted(T.c,CY_COLS[i]),x,y,T.sc,T.flip,.7*fade);
    }
  }
}

/* ---- обновление дополнительных систем ---- */
function updExtras(dt){
  for(let i=G.timers.length-1;i>=0;i--){const t=G.timers[i];t.t-=dt;if(t.t<=0){G.timers.splice(i,1);t.fn()}}
  updHaz(dt);
  if(G.mode==='dungeon'&&G.map.boss&&G.map.arenaRect){
    const a=G.map.arenaRect,b=G.boss;
    const inside=P.x>(a.x+.5)*TS&&P.x<(a.x+a.w-.5)*TS&&P.y>(a.y+.5)*TS&&P.y<(a.y+a.h-.5)*TS;
    if(!G.doors&&b&&!b.dead&&b.hp>0&&inside){
      G.doors=[];
      for(let y=a.y-1;y<=a.y+a.h;y++)for(let x=a.x-1;x<=a.x+a.w;x++){
        if(x>=a.x&&x<a.x+a.w&&y>=a.y&&y<a.y+a.h)continue;
        if((x===a.x-1||x===a.x+a.w)&&(y===a.y-1||y===a.y+a.h))continue;
        if(tileAt(G.map,x,y)===TL.FLOOR){G.doors.push([x,y]);setT(G.map,x,y,TL.DOOR)}
      }
      if(G.doors.length){say(__gornT(557),'bad');sfx('boom');G.shake=Math.max(G.shake,4)}
      b.awake=true;
    }else if(G.doors&&(!b||b.dead||b.hp<=0)){
      for(const [x,y] of G.doors)setT(G.map,x,y,TL.FLOOR);
      G.doors=null;say(__gornT(558),'good');sfx('bless');
    }
  }
  if(G.flash){G.flash.t-=dt;if(G.flash.t<=0)G.flash=null}
  if(G.perkQ>0&&!UI.open&&!G.dead&&typeof openPerks==='function')openPerks();

const MUS={
 '-1':{bpm:104,wave:'triangle',root:261.6,scale:[0,4,7,12,9,7,4,2],bass:[0,0,5,7],vol:.035,sparse:.25},
 '0':{bpm:72,wave:'sine',root:130.8,scale:[0,3,7,10,12,10,7,3],bass:[0,-2],vol:.04,sparse:.5},
 '1':{bpm:58,wave:'triangle',root:110,scale:[0,3,7,8,7,3,0,-2],bass:[0,0,-4,-2],vol:.04,sparse:.55},
 '2':{bpm:120,wave:'sawtooth',root:73.4,scale:[0,1,0,6,0,1,7,6],bass:[0,0,0,1],vol:.025,sparse:.15},
 '3':{bpm:62,wave:'sine',root:392,scale:[0,7,12,7,4,9,14,9],bass:[0,5],vol:.03,sparse:.65},
 '4':{bpm:52,wave:'square',root:98,scale:[0,1,6,7,10,11,6,1],bass:[0,0,6,6],vol:.018,sparse:.5}
};
let musKey=null,musStep=0,musNext=0;
function musicSet(b){
  if(String(b)===musKey)return;musKey=String(b);musStep=0;
  try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}
}
function musNote(f,dur,vol,wave,t){
  const o=AC.createOscillator(),g=AC.createGain();o.type=wave;o.frequency.value=f;
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+.05);
}
function musicTick(){
  if(MUTED||!AC||AC.state!=='running'||musKey===null||G.paused)return;
  const c=MUS[musKey];if(!c)return;
  const now=AC.currentTime;if(musNext<now)musNext=now+.05;
  while(musNext<now+.3){
    const step=60/c.bpm/2,n=c.scale[musStep%c.scale.length],fr=s=>c.root*Math.pow(2,s/12);
    if(Math.random()>c.sparse)musNote(fr(n),step*1.6,c.vol,c.wave,musNext);
    if(musStep%4===0)musNote(fr(c.bass[(musStep>>2)%c.bass.length]-12),step*3.5,c.vol*1.4,c.wave==='sawtooth'?'triangle':c.wave,musNext);
    musStep++;musNext+=step;
  }
}
setInterval(musicTick,120);

/* ===== ВВОД И ИГРОК ===== */
const HELD={};
const IN={keys:{},mx:VW/2,my:VH/2,mouse:false,atk:false,jx:0,jy:0,touch:false,aimT:0,pressed:{}};
function press(k){IN.pressed[k]=true}
function consume(k){const v=IN.pressed[k];IN.pressed[k]=false;return v}
/* Attack input and charge belong to one weapon, never to the next one. */
function clearWeaponAttack(){
  IN.atkQ=false;P.chgOn=false;P.chg=0;P.chgWait=false;P.chgDone=false;P.chgT0=0;P.buf=null;
}
function selectWeapon(slot,force){
  if(!force&&P.active===slot)return;
  P.active=slot;clearWeaponAttack();IN.weaponRelease=!!IN.atk;
  P.swing=null;P.sw=null;P.defl=null;
}

function aimAngle(){
  if(IN.touch){
    let best=null,bd=140;
    for(const m of G.mons){const d=Math.hypot(m.x-P.x,m.y-P.y);if(d<bd&&los(P.x,P.y,m.x,m.y)){bd=d;best=m}}
    if(best)return Math.atan2(best.y-P.y,best.x-P.x);
    return P.dir;
  }
  if(IN.mouse)return Math.atan2(IN.my+G.cam.y-P.y,IN.mx+G.cam.x-P.x);
  return P.dir;
}
function setFace(a){
  const c=Math.cos(a),s=Math.sin(a);
  P.face=Math.abs(c)>Math.abs(s)?'side':(s>0?'down':'up');
  P.flip=c<0;
}

function updatePlayer(dt){
  P.inv-=dt;P.flash-=dt;P.atkCd-=dt;P.dashCd-=dt;P.potCd-=dt;
  // ввод движения
  let ix=0,iy=0;const K=HELD;
  if(K.a||K.arrowleft)ix-=1;if(K.d||K.arrowright)ix+=1;if(K.w||K.arrowup)iy-=1;if(K.s||K.arrowdown)iy+=1;
  ix+=IN.jx;iy+=IN.jy;
  const il=Math.hypot(ix,iy);if(il>1){ix/=il;iy/=il}
  P.moving=il>.1;
  const aim=aimAngle();
  if(P.moving&&!IN.mouse&&!IN.touch){P.dir=Math.atan2(iy,ix)}
  else if(P.moving&&IN.touch&&!IN.atk){P.dir=Math.atan2(iy,ix)}
  if(IN.mouse||IN.touch||IN.atk)P.dir=aim;
  if(!IN.mouse&&!IN.touch&&P.moving)P.dir=Math.atan2(iy,ix);
  if(P.jump&&P.jump.lock!==undefined)P.dir=P.jump.lock;
  // скорость
  let sp=70*PACE.player*(1+P.st.move/100)*(G.mode==='dungeon'&&G.map.biome===3?1.1:1);
  sp*=1-P.st.slow;
  if(P.jump)sp*=.65;
  if(P.chgOn&&P.chg>CH_TAP)sp*=1-.15*Math.min(1,(P.chg-CH_TAP)/(CH_FULL-CH_TAP));
  if(P.slowT>0){P.slowT-=dt;sp*=.6}
  if(P.hasteT>0){P.hasteT-=dt;sp*=1.35}
  if(G.mods&&G.mods.pspd)sp*=G.mods.pspd;
  const tx=Math.floor(P.x/TS),ty=Math.floor(P.y/TS),tile=tileAt(G.map,tx,ty);
  const inWater=tile===TL.WATER;
  if(inWater)sp*=.65;

  if(t<.50)return H+1.5*Math.sin((t-.30)/.20*Math.PI);           /* лёгкое парение в верхней точке */

    const icon=e?iconCanvas(e):null;
    if(P.swing&&!P.swing.bow){
      ctx.save();ctx.strokeStyle=P.swing.heavy?'rgba(255,214,110,.9)':'rgba(255,255,255,.65)';ctx.lineWidth=P.swing.heavy?3:2;ctx.beginPath();
      if(P.swing.t>WW&&P.swing.t<P.swing.dur-RR)ctx.arc(sx,sy,P.swing.reach*.85,P.swing.a-(P.swing.sp||1.1),a);ctx.stroke();ctx.restore();
    }
    if(icon){
      ctx.save();ctx.translate(Math.round(sx+Math.cos(a)*5),Math.round(sy+Math.sin(a)*5));ctx.rotate(a+Math.PI/4);
      ctx.drawImage(icon,-3,-13);ctx.restore();
    }
  }else if(e){
    const icon=iconCanvas(e);
    ctx.save();ctx.translate(Math.round(sx+Math.cos(P.dir)*8),Math.round(sy+Math.sin(P.dir)*8));ctx.rotate(P.dir-Math.PI);
    ctx.drawImage(icon,-8,-8);
    if(P.arrows>0||(ITEM(e).fx.infinity>0)){ctx.fillStyle='#e8f0f8';ctx.fillRect(-10,0,12,1)}
    ctx.restore();
  }
}

/* стрела игрока: одна и та же отрисовка для полёта и для тетивы, с тонким чёрным контуром (1 px) */
function drawArrowSprite(c,n,tr,fire){
  const body=(ox,oy,k)=>{
    c.fillStyle=k||'#c8b080';c.fillRect(n-1+ox,-.5+tr+oy,14,1);
    c.fillStyle=k||'#c03030';c.fillRect(n-1.5+ox,-1.5+tr+oy,3,.9);c.fillRect(n-1.5+ox,.6+tr+oy,3,.9);
    c.fillStyle=k||(fire?'#ff9a3a':'#e8f0f8');
    c.beginPath();c.moveTo(n+13+ox,-1.9+tr+oy);c.lineTo(n+16.6+ox,tr+oy);c.lineTo(n+13+ox,1.9+tr+oy);c.closePath();c.fill();
  };
  for(const o of [[1,0],[-1,0],[0,1],[0,-1]])body(o[0],o[1],'#000');
  body(0,0);
}
function drawProj(ctx,p){
  const sx=p.x-G.cam.x,sy=p.y-G.cam.y;
  if(p.type==='arrow'||p.type==='bone'){
    ctx.save();ctx.translate(sx,sy);ctx.rotate(Math.atan2(p.vy,p.vx));
    if(p.type==='bone'){
      ctx.fillStyle='#e8e4d4';ctx.fillRect(-5,-.5,8,1);
      ctx.fillStyle='#e8f0f8';ctx.fillRect(3,-1,2,2);
    }else{
      /* та же стрела, что лежит на тетиве лука (см. bowDraw): древко 14 px, красное оперение, треугольный наконечник;
         остриё в точке +5, как и раньше, чтобы попадания не изменились */
      drawArrowSprite(ctx,-11.6,0,p.fire>0);
    }
    ctx.restore();
    if(p.fire>0&&Math.random()<.6)G.parts.push({x:p.x,y:p.y,vx:0,vy:-10,life:.25,c:'#ff8a2a',s:1});
  }else{
    const col=p.type==='fire'?['#ff5a14','#ffd84a']:p.type==='magic'?['#8a4aff','#e0c8ff']:p.type==='ice'?['#4aa8ff','#e0ffff']:['#4fbf4a','#c8ffb8'];
    ctx.fillStyle=col[0];ctx.beginPath();ctx.arc(sx,sy,p.r+1,0,6.283);ctx.fill();
    ctx.fillStyle=col[1];ctx.fillRect(Math.round(sx)-1,Math.round(sy)-1,2,2);
    if(Math.random()<.5)G.parts.push({x:p.x,y:p.y,vx:rnd(-8,8),vy:rnd(-8,8),life:.25,c:col[0],s:1});
  }
}

function drawLight(ctx,time){
  const B=BIOMES[G.map.biome],cx=G.cam.x,cy=G.cam.y;
  LX.globalCompositeOperation='source-over';
  LX.fillStyle='rgba('+B.dark[0]+','+B.dark[1]+','+B.dark[2]+','+B.dark[3]+')';LX.fillRect(0,0,VW,VH);
  LX.globalCompositeOperation='destination-out';
  const rad=(x,y,r,a)=>{
    if(x<-r||y<-r||x>VW+r||y>VH+r)return;
    const g=LX.createRadialGradient(x,y,r*.12,x,y,r);g.addColorStop(0,'rgba(0,0,0,'+a+')');g.addColorStop(1,'rgba(0,0,0,0)');
    LX.fillStyle=g;LX.fillRect(x-r,y-r,r*2,r*2);
  };
  rad(P.x-cx,P.y-cy,G.map.biome===4?100:125,1);
  for(const d of G.map.decor)if(d.k==='torch')rad(d.x-cx,d.y-cy,58+Math.sin(time*9+d.x)*3,.95);
  for(const p of G.projs)if(p.type!=='arrow'&&p.type!=='bone')rad(p.x-cx,p.y-cy,26,.9);
  const x0=Math.max(0,(cx/TS|0)-2),x1=Math.min(G.map.w,((cx+VW)/TS|0)+3),y0=Math.max(0,(cy/TS|0)-2),y1=Math.min(G.map.h,((cy+VH)/TS|0)+3);
  for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){const t=G.map.t[y*G.map.w+x];if(t===TL.LAVA)rad(x*TS+8-cx,y*TS+8-cy,34,.8);else if(t===TL.CHASM)rad(x*TS+8-cx,y*TS+8-cy,30,.5)}
  if(window.__fxLight)window.__fxLight(rad,cx,cy);
  for(const m of G.mons)if(m.elite||m.boss)rad(m.x-cx,m.y-cy,m.boss?60:30,.7);
  ctx.drawImage(LC,0,0);
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(const d of G.map.decor)if(d.k==='torch'){const x=d.x-cx,y=d.y-cy;if(x<-60||y<-60||x>VW+60||y>VH+60)continue;
    const g=ctx.createRadialGradient(x,y,2,x,y,50);g.addColorStop(0,'rgba(255,170,70,.20)');g.addColorStop(1,'rgba(255,170,70,0)');ctx.fillStyle=g;ctx.fillRect(x-50,y-50,100,100)}
  ctx.restore();
}

function render(ctx,time){
  const M=G.map,cam=G.cam;
  const sh=G.shake>0?G.shake:0;
  const ox=sh?(Math.random()-.5)*sh:0,oy=sh?(Math.random()-.5)*sh:0;
  ctx.save();ctx.translate(Math.round(-ox),Math.round(-oy));
  const back=SKB(M.skin!=null?M.skin:M.biome);
  ctx.fillStyle=M.town?'#2f6a2f':(back&&back.top||'#07060b');ctx.fillRect(-4,-4,VW+8,VH+8);
  const cx=Math.floor(cam.x),cy=Math.floor(cam.y);
  const x0=Math.max(0,(cx/TS)|0),x1=Math.min(M.w,((cx+VW)/TS|0)+1),y0=Math.max(0,(cy/TS)|0),y1=Math.min(M.h,((cy+VH)/TS|0)+1);
  const camSave=cam.x;cam.x=cx;cam.y=cy;
  for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++)drawTile(ctx,M,x,y,x*TS-cx,y*TS-cy,time);
  // выход-провал: пульсирующее свечение
  if(!M.town&&M.exitTiles&&tileAt(M,M.exitTiles[0][0],M.exitTiles[0][1])===TL.CHASM){
    const e=M.exitPos,a=.15+.1*Math.sin(time*3);ctx.fillStyle='rgba(160,100,255,'+a+')';ctx.beginPath();ctx.arc(e.x-cx,e.y-cy,22,0,6.283);ctx.fill();
  }
  for(const d of M.decor)drawDecor(ctx,d,time);
  if(!M.town&&M.start&&(!DF.m.noPortal||M.bpo)){const sp=M.startPortal=M.startPortal||{x:M.start.x,y:M.start.y-8};
    const px_=sp.x-cx,py_=sp.y-cy;ctx.fillStyle='rgba(90,170,255,.25)';ctx.beginPath();ctx.ellipse(px_,py_+4,11,5,0,0,6.283);ctx.fill();
    for(let i=0;i<5;i++){const a=time*2.4+i*1.26;ctx.fillStyle=i%2?'#8ac8ff':'#d0eaff';ctx.fillRect(px_+Math.cos(a)*7-1,py_+4+Math.sin(a)*3-1-((time*10+i*3)%8),2,2)}}
  if(window.__fxBack)window.__fxBack(ctx,cx,cy,time);
  // сущности с сортировкой по y
  const list=[];
  for(const c of G.chests)list.push({y:c.y,f:()=>{
    const sx=c.x-cx,sy=c.y-cy;shadow(ctx,sx,sy+6,8);
    ctx.drawImage(chestSprite(c.tier,c.open),Math.round(sx-8),Math.round(sy-10));
    if(!M.town&&(M.skin===5||M.skin===6))drawChestVines(ctx,Math.round(sx-8),Math.round(sy-10));
    if(c.tier>=2&&!c.open&&Math.random()<.08)G.parts.push({x:c.x+rnd(-6,6),y:c.y-rnd(0,8),vx:0,vy:-12,life:.5,c:'#fff6c0',s:1});
  }});
  let spkN=null,spkD=48;for(const n of G.npcs){const d=Math.hypot(P.x-n.x,P.y-n.y);if(d<spkD){spkD=d;spkN=n}}
  for(const n of G.npcs)list.push({y:n.y,f:()=>{
    const sx=n.x-cx,sy=n.y-cy;shadow(ctx,sx,sy+6,6);
    ctx.drawImage(art(n.art||n.kind,n.vr),Math.round(sx-8),Math.round(sy-12+Math.sin(time*2+n.x)*.6));
    if(n===spkN){
      const line=n.line[((time/4)|0)%n.line.length];
      txt(sx,sy-26,line,'#e7ebf0',{bubble:1,size:6.5});
      txt(sx,sy-(n.kind==='wander'?37:31),n.name,'#e5b04a',{size:5.5});
    }
  }});
  for(const s of G.shrines)list.push({y:s.y,f:()=>{
    const sx=Math.round(s.x-cx),sy=Math.round(s.y-cy);
    const col=s.used?'#555a66':s.kind==='rgb'?'rgb('+s.rgb[0]+','+s.rgb[1]+','+s.rgb[2]+')':s.kind==='blood'?'#e8364a':s.kind==='greed'?'#ffd84a':s.kind==='choice'?'#7fe0a0':'#7aa8ff';
    const pu=s.used?.3:.6+.4*Math.sin(time*4);
    shadow(ctx,sx,sy+6,8);
    /* руна на полу */
    ctx.save();ctx.strokeStyle=col;ctx.globalAlpha=s.used?.15:.25+.2*Math.sin(time*2.4);ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(sx,sy+4,12,4.5,0,0,6.283);ctx.stroke();ctx.restore();
    /* ступени и колонна */
    ctx.fillStyle='#1f232b';ctx.fillRect(sx-8,sy+3,16,3);ctx.fillStyle='#2c313c';ctx.fillRect(sx-6,sy+1,12,3);
    ctx.fillStyle='#4a5060';ctx.fillRect(sx-4,sy-10,8,12);ctx.fillStyle='#646c80';ctx.fillRect(sx-4,sy-10,3,12);ctx.fillStyle='#3a404e';ctx.fillRect(sx+2,sy-10,2,12);
    ctx.fillStyle='#5b6478';ctx.fillRect(sx-5,sy-12,10,3);ctx.fillStyle='#7a8398';ctx.fillRect(sx-5,sy-12,10,1);
    /* светящиеся руны на колонне */
    ctx.globalAlpha=pu;ctx.fillStyle=col;ctx.fillRect(sx-1,sy-8,2,1);ctx.fillRect(sx-2,sy-5,4,1);ctx.fillRect(sx-1,sy-2,2,1);ctx.globalAlpha=1;
    /* сфера с ореолом */
    const oy=sy-16+Math.sin(time*3)*1.2;
    ctx.globalAlpha=(s.used?.05:.14+.08*Math.sin(time*4))*1;ctx.fillStyle=col;ctx.beginPath();ctx.arc(sx,oy,8,0,6.283);ctx.fill();
    ctx.globalAlpha=pu;ctx.beginPath();ctx.arc(sx,oy,3.4,0,6.283);ctx.fill();
    ctx.globalAlpha=s.used?.2:.9;ctx.fillStyle='#ffffff';ctx.fillRect(sx-1,oy-2,1,1);
    if(!s.used){ctx.globalAlpha=.8;ctx.fillStyle=col;for(let i=0;i<2;i++){const an=time*2.2+i*3.1416;ctx.fillRect(Math.round(sx+Math.cos(an)*7),Math.round(oy+Math.sin(an)*2.6),1,1)}}
    ctx.globalAlpha=1;
    if(!s.used&&Math.random()<.1)G.parts.push({x:s.x+rnd(-4,4),y:s.y-10,vx:0,vy:-14,life:.6,c:col,s:1});
  }});
  if(M.town&&M.plots)for(const id in M.plots){if(P.built[id])continue;const pl=M.plots[id];list.push({y:(pl.y+3)*TS,f:()=>{
    const sx=(pl.x+2.5)*TS-cx,sy=(pl.y+3)*TS-cy;ctx.fillStyle='#6a4a2a';ctx.fillRect(Math.round(sx-1),Math.round(sy-8),2,10);ctx.fillStyle='#d8c9a8';ctx.fillRect(Math.round(sx-6),Math.round(sy-10),12,5);ctx.fillStyle='#8a6a3a';ctx.fillRect(Math.round(sx-6),Math.round(sy-10),12,1);
    ctx.fillStyle='#6a4a2a';for(const [ox,oy] of [[-18,-14],[16,-14],[-18,6],[16,6]])ctx.fillRect(Math.round(sx+ox),Math.round(sy+oy),2,5);
  }})}
  if(M.town&&M.plots)for(const b of BUILD)if(P.built[b.id]){const pl=M.plots[b.id];if(!pl)continue;txt((pl.x+2.5)*TS-cx,(pl.y)*TS-cy-3,b.n+(typeof lvTag==='function'?lvTag(b.id):''),'#ffe9b0',{size:6.5,bold:1})}
  const pad=48;
  for(const m of G.mons)if(m.x>=cx-pad&&m.x<=cx+VW+pad&&m.y>=cy-pad&&m.y<=cy+VH+pad)list.push({y:m.y,f:()=>drawMon(ctx,m,time)});
  if(G.crushed){G.crushed=G.crushed.filter(c=>G.time-c.t0<1&&c.mode===G.mode&&c.depth===G.depth);
    for(const c of G.crushed)list.push({y:c.y-50,f:()=>{
      const k=1-(G.time-c.t0)/1,sx=c.x-G.cam.x,sy=c.y-G.cam.y,sc=c.sc,bot=sy+4*sc;
      const spr=art(c.art,c.vr);ctx.save();ctx.globalAlpha=Math.min(1,k*2.5);ctx.fillStyle='rgba(10,5,5,.6)';ctx.beginPath();ctx.ellipse(sx,bot,c.r*sc*1.3,c.r*sc*.5,0,0,6.283);ctx.fill();
      try{ctx.filter='brightness(.5)'}catch(e){}
      ctx.translate(0,bot);ctx.scale(1,.3);ctx.translate(0,-bot);
      sprDraw(ctx,spr,sx-8*sc,sy-12*sc,sc,c.face<0&&c.art!=='slime'&&c.art!=='ghost');
      ctx.restore()}})}
  list.push({y:P.y,f:()=>drawPlayer(ctx,time)});
  for(const d of G.drops)list.push({y:d.y,f:()=>{
    const sx=d.x-cx,sy=d.y-cy,bob=Math.sin(time*4+d.x)*1.5;
    if(d.kind==='gold'){const w=Math.abs(Math.cos(time*6+d.x))*4+1;ctx.fillStyle='#b8860b';ctx.fillRect(Math.round(sx-w/2),Math.round(sy-3+bob),Math.round(w),5);ctx.fillStyle='#ffd84a';ctx.fillRect(Math.round(sx-w/2),Math.round(sy-3+bob),Math.max(1,Math.round(w)-1),4)}
    else if(d.kind==='item'){
      const it=ITEM(d.e),col=RCOL[it.rar];
      ctx.fillStyle=col;ctx.globalAlpha=.28;ctx.beginPath();ctx.ellipse(sx,sy+3,8,3,0,0,6.283);ctx.fill();
      if(it.rar>=2){const g=ctx.createLinearGradient(0,sy-26,0,sy);g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(1,col);ctx.globalAlpha=.35;ctx.fillStyle=g;ctx.fillRect(Math.round(sx-3),Math.round(sy-26),6,26)}
      ctx.globalAlpha=1;ctx.drawImage(iconCanvas(d.e),Math.round(sx-8),Math.round(sy-12+bob));
    }else{const c=art(d.kind==='potion'?'potion':'arrows');shadow(ctx,sx,sy+3,4);ctx.drawImage(c,Math.round(sx-6),Math.round(sy-9+bob),12,12)}
  }});
  list.sort((a,b)=>a.y-b.y).forEach(o=>o.f());
  if(window.__fxFront)window.__fxFront(ctx,cx,cy,time);
  for(const h of G.haz){const pr=1-h.t/h.max,sx=h.x-cx,sy=h.y-cy;ctx.globalAlpha=.18+.3*pr;ctx.fillStyle=h.col;ctx.beginPath();ctx.arc(sx,sy,h.r*(.5+.5*pr),0,6.283);ctx.fill();ctx.globalAlpha=.8;ctx.strokeStyle=h.col;ctx.lineWidth=1;ctx.beginPath();ctx.arc(sx,sy,h.r,0,6.283);ctx.stroke();ctx.globalAlpha=1}
  for(const p of G.projs)drawProj(ctx,p);
  drawDeaths(ctx);
  if(typeof drawLasers==='function')drawLasers(ctx,cx,cy);
  for(const p of G.parts){ctx.fillStyle=p.c;ctx.fillRect(Math.round(p.x-cx),Math.round(p.y-cy),p.s,p.s)}
  cam.x=camSave;
  if(!M.town)drawLight(ctx,time);
  if(G.flash){ctx.globalAlpha=Math.min(.4,G.flash.t/.55*.4);ctx.fillStyle=G.flash.c;ctx.fillRect(0,0,VW,VH);ctx.globalAlpha=1}
  if(G.fallT>.05&&G.mode==='dungeon'){const bx=Math.round(P.x-cx-11),by=Math.round(P.y-cy-30);ctx.fillStyle='#0d1015';ctx.fillRect(bx-1,by-1,24,6);ctx.fillStyle='#3a2a5a';ctx.fillRect(bx,by,22,4);ctx.fillStyle='#b98cff';ctx.fillRect(bx,by,Math.round(22*Math.min(1,G.fallT/2)),4)}
  // тексты урона (чёткий слой)
  for(const t of G.texts)txt(t.x-cx,t.y-cy,t.t,t.c,{bold:t.big,size:t.big?9:8,alpha:Math.min(1,t.life/.3)});
  // подсказка у интерактивного объекта
  if(G.hint){
    const o=G.hint.o,x=Math.round(o.x-cx),y=Math.round(o.y-cy-(o.tier!==undefined?14:22));
    const a=.6+.4*Math.sin(time*6);ctx.fillStyle='rgba(255,216,74,'+a+')';
    if(o.tier!==undefined){const by=y-3+Math.round(Math.sin(time*5)*1.5);ctx.fillStyle='#0d1015';ctx.fillRect(x-6,by-6,12,12);ctx.fillStyle='rgba(255,216,74,'+a+')';ctx.fillRect(x-5,by-5,10,10);txt(x,by+3,'E','#ffffff',{size:8,bold:1})}
    else{ctx.fillRect(x-3,y-3,6,6);txt(x,y+2.5,'E','#ffffff',{size:6,bold:1})}
  }
  ctx.restore();
  flushText();
}

function updateParticles(dt){
  for(let i=G.parts.length-1;i>=0;i--){const p=G.parts[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.94;p.vy*=.94;if(p.life<=0)G.parts.splice(i,1)}
  if(G.parts.length>1400)G.parts.splice(0,G.parts.length-1400);
  if(G.texts.length>90)G.texts.splice(0,G.texts.length-90);
  if(G.deaths&&G.deaths.length>60)G.deaths.splice(0,G.deaths.length-60);
  if(G.slams&&G.slams.length>12)G.slams.splice(0,G.slams.length-12);
  for(let i=G.texts.length-1;i>=0;i--){const t=G.texts[i];t.life-=dt;t.y+=t.vy*dt;t.vy*=.93;if(t.life<=0)G.texts.splice(i,1)}
  G.shake=Math.max(0,G.shake-dt*18);
}

/* ---- миникарта ---- */
let miniT=0;
function updateMini(dt){
  const M=G.map;
  if(M.town){MINI.parentElement.hidden=true;return}
  MINI.parentElement.hidden=false;
  if(MINI.width!==M.w||MINI.height!==M.h){MINI.width=M.w;MINI.height=M.h}
  const px_=Math.floor(P.x/TS),py_=Math.floor(P.y/TS);
  for(let y=py_-8;y<=py_+8;y++)for(let x=px_-9;x<=px_+9;x++){
    if(x<0||y<0||x>=M.w||y>=M.h)continue;
    if((x-px_)*(x-px_)+(y-py_)*(y-py_)*1.3<=64)M.seen[y*M.w+x]=1;
  }
  miniT-=dt;if(miniT>0)return;miniT=.25;
  const img=MX.createImageData(M.w,M.h),d=img.data;
  const B=BIOMES[M.biome];
  for(let y=0;y<M.h;y++)for(let x=0;x<M.w;x++){
    const i=y*M.w+x;if(!M.seen[i])continue;
    const t=M.t[i];let c=null;
    if(t===TL.WALL){let n=false;for(let dy=-1;dy<=1&&!n;dy++)for(let dx=-1;dx<=1;dx++)if(tileAt(M,x+dx,y+dy)!==TL.WALL&&tileAt(M,x+dx,y+dy)!==undefined&&M.seen[Math.max(0,Math.min(M.w*M.h-1,(y+dy)*M.w+x+dx))]){n=true;break}if(n)c=[70,74,90]}
    else if(t===TL.WATER)c=[60,110,170];else if(t===TL.LAVA)c=[255,120,30];else if(t===TL.CHASM)c=[170,110,255];else c=[130,134,150];
    if(c){d[i*4]=c[0];d[i*4+1]=c[1];d[i*4+2]=c[2];d[i*4+3]=255}
  }
  MX.putImageData(img,0,0);
  if(((performance.now()/300)|0)%2){MX.fillStyle='#ffffff';MX.fillRect(px_-1,py_-1,3,3)}
  MX.fillStyle='#ffd84a';
  for(const c of G.chests)if(!c.open&&M.seen[Math.floor(c.y/TS)*M.w+Math.floor(c.x/TS)])MX.fillRect(Math.floor(c.x/TS),Math.floor(c.y/TS),1,1);
  /* подбираемые предметы на полу (в т.ч. выпавшие из сундуков и пропущенные игроком) — зелёные точки */
  MX.fillStyle='#3dff6a';
  for(const d of G.drops){const tx=Math.floor(d.x/TS),ty=Math.floor(d.y/TS);if(tx>=0&&ty>=0&&tx<M.w&&ty<M.h&&M.seen[ty*M.w+tx])MX.fillRect(tx,ty,1,1)}
  gornDrawExitMarker(M);
}

const PACK_PAL=[['#8a5a2b','#5a3a1c','#6a4220'],['#4a8a3a','#2a5a22','#3a6a2c'],['#3a6ab8','#24448a','#2c5498'],['#8a4ad0','#5a2a98','#6a3ab0'],['#e0902a','#a05a10','#b8701a'],['#e8508a','#a02a5a','#c03a6e']];

/* ---- Внешний вид лутбокса зависит от его характеристик (полностью детерминированно) ---- */
const BX_CAT={any:'#d8d8e4',weapon:'#e0605a',sword:'#f0504a',bow:'#44b8a0',armor:'#5a8ae0',helmet:'#e8a840',chest:'#6a7ae8',legs:'#a870e0',boots:'#c88850'};
const BX_EN={sharp:'#ff6a6a',fire:'#ff8a2a',crit:'#ffd84a',vamp:'#c0204a',loot:'#f0c030',power:'#ff9a4a',flame:'#ff5a1a',aim:'#7ad0ff',quick:'#9aff9a',inf:'#c89aff',dura:'#b0b8c0',prot:'#5a8ad8',fprot:'#e8683a'};
const BX_FORGE=['#7a7a7a','#a8a8a8','#d0d0d0','#f0c840','#7fe8ff','#ff9ae8'];
const BX_PUR=['#9a8a7a','#a8c8e0','#8be0ff','#7fffd8','#e8f4ff','#ffffff'];
const BX_GLYPH={any:['#.#','.#.','#.#'],weapon:['###','.#.','.#.'],sword:['.#.','.#.','###'],bow:['##.','#.#','##.'],armor:['###','###','.#.'],helmet:['.#.','###','#.#'],chest:['###','.#.','###'],legs:['###','#.#','#.#'],boots:['#..','#..','###']};
const bxRgb=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const bxHex=a=>'#'+a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
const bxMix=(a,b,t)=>{const x=bxRgb(a),y=bxRgb(b);return bxHex(x.map((v,i)=>v+(y[i]-v)*t))};
function bxHsl(h,s,l){const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return bxHex([f(0)*255,f(8)*255,f(4)*255])}
function bxEnchCol(k){if(BX_EN[k])return BX_EN[k];let h=0;for(let i=0;i<k.length;i++)h=(h*31+k.charCodeAt(i))>>>0;return bxHsl(h%360,.8,.6)}
function boxLuck(b){return (b.luck>0||artOn('luck'))?1:((b.luck<0&&!artOn('luck'))?-1:0)}
function boxKey(b){return 'bx2|'+[b.cat,boxTier(b),b.r?b.r.join('-'):'',b.mat?b.mat.join(','):'',b.forge?b.forge.join('-'):'',b.pur?b.pur.join('-'):'',b.ench?b.ench.k+b.ench.lo+'-'+b.ench.hi:'',boxLuck(b)].join('|')}
function boxCanvas(b){
  const tier=boxTier(b),P0=CHEST_PAL[tier],cc=BX_CAT[b.cat]||'#d8d8e4',lk=boxLuck(b);
  const square=!!(b.ench||(b.forge&&b.pur)||(b.r&&b.r[0]>=3));
  const c=mkc(16,16),x=c.getContext('2d');
  const px=(X,Y,col)=>{if(X<0||Y<0||X>15||Y>15)return;x.fillStyle=col;x.fillRect(X,Y,1,1)};
  const x0=square?2:1,x1=square?13:14,top=square?2:3,lt=top+1,lb=6,dv=7,bt=8,bb=12,bot=13;
  let bodL=P0.B,bodD=P0.b,lidBaseL=P0.L,lidBaseD=P0.l,out=P0.o,matLo=null,matHi=null,treat=null;
  if(b.mat&&b.mat.length){
    const lo=b.mat[0],hi=b.mat[b.mat.length-1],cl=m=>(MATS[m]||WOODS[m]).c;
    matLo=cl(lo);matHi=cl(hi);treat=(MATS[hi]||WOODS[hi]).treat;
    bodL=bxMix(P0.B,matHi[1],.55);bodD=bxMix(P0.b,matHi[0],.6);
  }
  const enc=b.ench?bxEnchCol(b.ench.k):null;
  if(enc)out=bxMix(P0.o,enc,.7);else if(lk<0)out=bxMix(P0.o,'#4a1a5a',.7);
  const r0=b.r?b.r[0]:null,r1=b.r?b.r[1]:null;
  const lidC=(X,dark)=>{
    const t=(X-x0)/(x1-x0);
    let col=dark?lidBaseD:lidBaseL;
    if(matLo)col=bxMix(col,bxMix(matLo[dark?1:2],matHi[dark?1:2],t),.55);
    if(b.r)col=bxMix(col,bxMix(RCOL[r0],RCOL[r1],t),dark?.4:.28);
    return col;
  };
  for(let X=x0+1;X<=x1-1;X++){px(X,top,out);px(X,bot,out)}
  for(let Y=lt;Y<=bb;Y++){px(x0,Y,out);px(x1,Y,out)}
  for(let X=x0;X<=x1;X++)px(X,dv,out);
  for(let Y=lt;Y<=lb;Y++)for(let X=x0+1;X<=x1-1;X++)px(X,Y,lidC(X,Y>lt&&Y<lb&&X>x0+1&&X<x1-1));
  for(let Y=bt;Y<=bb;Y++)for(let X=x0+1;X<=x1-1;X++)px(X,Y,((Y-bt)%2===1&&X>x0+1&&X<x1-1)?bodD:bodL);
  /* полоска и замок: цвет полоски зависит от категории */
  for(let Y=lt;Y<=lb;Y++)for(const X of [7,8])px(X,Y,bxMix(lidC(X,false),cc,.55));
  const strap=bxMix(cc,'#000000',.22);
  for(let Y=dv;Y<=bb;Y++)for(const X of [7,8])px(X,Y,strap);
  const lockC=bxMix('#ffffff',cc,.3);
  px(7,8,'#ffffff');px(8,8,lockC);px(7,9,lockC);px(8,9,bxMix(lockC,'#000000',.25));
  /* значок категории */
  const g=BX_GLYPH[b.cat]||BX_GLYPH.any,gc=bxMix(cc,'#ffffff',.35);
  for(let j=0;j<3;j++)for(let i=0;i<3;i++)if(g[j][i]==='#')px(4+i,9+j,gc);
  /* кристальные материалы блестят */
  if(treat==='crystal'){px(5,lt,'#ffffff');px(10,lt+1,bxMix('#ffffff',matHi[2],.5))}
  /* закалка: заклёпки по углам корпуса (слева — минимум, справа — максимум) */
  if(b.forge){const a=BX_FORGE[b.forge[0]],z=BX_FORGE[b.forge[1]];px(x0+1,bt,a);px(x0+1,bb,a);px(x1-1,bt,z);px(x1-1,bb,z)}
  /* чистота: камни на крышке */
  if(b.pur){const n=1+(b.pur[1]>=3?1:0)+(b.pur[1]>=5?1:0),pos=[x0+2,x1-2,5,10];for(let i=0;i<n;i++)px(pos[i],lt+1,BX_PUR[i===0?b.pur[0]:b.pur[1]])}
  /* зачарование: светящаяся обводка и искры */
  if(enc){px(x0+1,lt,enc);px(x1-1,lb,enc);if(b.ench.hi>=3){px(x0+1,lb,enc);px(x1-1,lt,enc)}}
  /* удача: зелёный клевер с обводкой; неудача: трещины и крестик */
  const cx=x1-2,cy=top;
  if(lk>0){
    const leaf=[[0,-1],[-1,0],[1,0],[0,1]],oc='#0e3a18';
    for(const [dx,dy] of leaf)for(const [ex,ey] of [[1,0],[-1,0],[0,1],[0,-1]])px(cx+dx+ex,cy+dy+ey,oc);
    for(const [dx,dy] of leaf)px(cx+dx,cy+dy,'#5fe07a');
    px(cx,cy,'#2fa04a');
  }else if(lk<0){
    const arm=[[-1,-1],[1,-1],[0,0],[-1,1],[1,1]],oc='#14081a';
    for(const [dx,dy] of arm)for(const [ex,ey] of [[1,0],[-1,0],[0,1],[0,-1]])px(cx+dx+ex,cy+dy+ey,oc);
    for(const [dx,dy] of arm)px(cx+dx,cy+dy,'#c0405a');
    for(const [X,Y] of [[10,9],[11,10],[11,11],[12,11]])px(X,Y,'#1a0a20');
  }
  return c;
}

function pickGlasses(){
  const opts=[];if(!P.glasses)opts.push({glasses:1,price:DF.pts(GLASSES_PRICE)});if(!P.xray)opts.push({xray:1,price:DF.pts(XRAY_PRICE)});if(!P.mem)opts.push({mem:1,price:MEM_PRICE[DF.id]||1200});
  return opts.length?opts[(Math.random()*opts.length)|0]:null;
}
function genStock(){
  const d=Math.max(1,P.deepest);G.stock=[];
  for(let i=0;i<6;i++){
    if(Math.random()<.22){const b=makeBox(d);G.stock.push({box:b,price:b.price})}
    else G.stock.push({e:lootItem(d,2)});
  }
  if(Math.random()<.9){let n=Math.random()*100,r=0;for(let k=0;k<6;k++){n-=PACK_W[k];if(n<0){r=k;break}}G.stock.push({pack:PACK_N[r],pr:r,price:PACK_PRICE[r]})}
  else G.stock.push({e:lootItem(d,2)});
  G.stock.push({e:lootItem(d+2,7),rare:1});
  G.stock.forEach(x=>{if(!x.price)x.price=buyPrice(x.e)});
  /* скидка: у каждого товара 5% шанс, цена ниже на 20–30% */
  G.stock.forEach(x=>{if(!x)return;if(artOn('tenants')&&x.price)x.price=Math.max(1,Math.round(x.price*.4));
    if(Math.random()<.01){x.old=x.price;x.price=Math.max(1,Math.round(x.old*.3));x.day=true}   /* товар дня: −70% */
    else if(Math.random()<(artOn('hero')?.25:.05)){x.old=x.price;x.price=Math.max(1,Math.round(x.old*(.7+Math.random()*.1)))}});
  const gl=pickGlasses();if(gl)G.stock.push(gl);
}

function openShop(kind){

}

function cmpMark(e,src){
  if(!P.glasses||src==='eq'||src==='stash'||isBox(e))return '';
  const cur=P.eq[SLOT_OF[e.t]];
  if(!cur)return __gornT(574);
  if(sameE(cur,e))return '';
  const a=ITEM(e),b=ITEM(cur);
  let r='eq';
  if(a.headline.value!==b.headline.value&&a.headline.raw!==b.headline.raw)r=a.headline.raw>b.headline.raw?'up':'down';
  else if(a.score!==b.score)r=a.score>b.score?'up':'down';
  return r==='up'?__gornT(575):r==='down'?__gornT(576):__gornT(577);
}

/* подсказка при удержании 1 секунду: название локации и сложность звёздами */
(function(){
  let tm=null,tip=null,cur=null,sup=0;
  const clear=()=>{clearTimeout(tm);tm=null;if(tip){tip.remove();tip=null}};
  const btnOf=ev=>ev.target&&ev.target.closest?ev.target.closest('.dive .dv'):null;
  const show=b=>{
    const dl=document.getElementById('dlg');if(!dl||dl.hidden||!b.isConnected)return;
    const bi=+b.dataset.bi,fi=FLOOR_INFO[bi];if(!fi)return;
    clear();tip=document.createElement('div');tip.id='dvtip';
    tip.innerHTML='<b>'+esc(BIOMES[bi].name)+'</b><span class="st"><i>'+'★'.repeat(fi.st)+'</i>'+'☆'.repeat(5-fi.st)+'</span>';
    document.body.appendChild(tip);
    const r=b.getBoundingClientRect(),w=tip.offsetWidth,h=tip.offsetHeight;
    let left=Math.max(6,Math.min(innerWidth-w-6,r.left+r.width/2-w/2)),top=r.top-h-8;if(top<6)top=r.bottom+8;
    tip.style.left=left+'px';tip.style.top=top+'px';
  };
  const begin=ev=>{const b=btnOf(ev);if(!b||b===cur)return;clear();cur=b;tm=setTimeout(()=>show(b),1000)};
  document.addEventListener('mouseover',begin);
  document.addEventListener('mouseout',ev=>{if(!cur)return;const rt=ev.relatedTarget;if(rt&&cur.contains(rt))return;clear();cur=null});
  document.addEventListener('touchstart',begin,{passive:true});
  const tEnd=()=>{if(tip){sup=Date.now();const x=tip;setTimeout(()=>{if(tip===x){clear()}cur=null},1500)}else{clear();cur=null}};
  document.addEventListener('touchend',tEnd);document.addEventListener('touchcancel',tEnd);
  document.addEventListener('click',ev=>{
    if(btnOf(ev)&&Date.now()-sup<700){ev.stopPropagation();ev.preventDefault();return}
    clear();cur=null;
  },true);
})();

function genBounty(){

  for(let s=0;s<=Math.min(stage,BIOME_MOBS.length-1);s++)BIOME_MOBS[s].forEach(x=>{if(keys.indexOf(x[0])<0)keys.push(x[0])});
  const r=Math.random();
  const b={k:'any',n:0,got:0,done:false};
  if(r<.25)b.k='any';else if(r<.45)b.k='elite';else b.k=keys[(Math.random()*keys.length)|0];
  b.n=b.k==='elite'?rndI(3,6):rndI(10,24);
  const unit=b.k==='elite'?40:7;
  b.gold=Math.round(b.n*(unit+P.deepest*2.2)*rnd(.9,1.15)*.8);
  b.item=b.n>=18||b.k==='elite';

}

/* нетопырь: кружит и пикирует, замедляет */
AI.swoop=(m,dt,dx,dy,dist)=>{
  m.sw=(m.sw||0)-dt;
  if(m.state!=='dive'){
    const a=Math.atan2(dy,dx)+Math.PI+Math.sin(m.t*1.7)*.9;
    const tx=P.x+Math.cos(a+m.t*1.3)*52,ty=P.y+Math.sin(a+m.t*1.3)*52;
    const ang=Math.atan2(ty-m.y,tx-m.x);moveEnt(m,Math.cos(ang)*m.sp*dt,Math.sin(ang)*m.sp*dt,true);
    if(m.sw<=0&&dist<130){m.state='dive';m.sw=.55;m.ax=dx/dist;m.ay=dy/dist;m.tele=.2}
  }else{
    moveEnt(m,m.ax*m.sp*3.4*dt,m.ay*m.sp*3.4*dt,true);
    if(m.sw<=0){m.state='chase';m.sw=rnd(1.4,2.4)}
  }
};
/* волчья стая: чем больше волков рядом, тем быстрее */
AI.pack=(m,dt,dx,dy,dist)=>{
  m.sp0=m.sp0||m.sp;
  let n=0;for(const o of G.mons)if(o!==m&&o.k==='frostwolf'&&!o.dead&&Math.hypot(o.x-m.x,o.y-m.y)<90)n++;
  m.sp=m.sp0*(1+Math.min(.45,.15*n));
  if(n&&!m.howl&&dist<120){m.howl=1;addText(m.x,m.y-14,__gornT(933),'#bfe8ff')}
  AI.lunge(m,dt,dx,dy,dist);
};
/* йети: бросает снежки издали, ударом по земле рассыпает льдины */
AI.yeti=(m,dt,dx,dy,dist)=>{
  if(m.state==='slam'){m.st-=dt;if(m.st<=0){m.state='chase';G.shake=Math.max(G.shake,4);sfx('boom');for(let i=0;i<12;i++)shoot('m',m.x,m.y,i/12*6.283,70,m.dmg*.5,{type:'ice',r:3,life:1.2});}return}
  if(dist>m.r+P.r)steer(m,dt,P.x,P.y,m.sp*(dist>90?1:1));
  if(m.cd<=0){
    if(dist<70){m.state='slam';m.st=.55*TM();m.tele=.55*TM();m.cd=rnd(3.4,4.4)}
    else if(dist<170){m.cd=rnd(2,3);const a=Math.atan2(dy,dx);shoot('m',m.x,m.y,a,70,m.dmg*.9,{type:'ice',r:4,life:2.6});sfx('fire')}
  }
};
/* ледяной маг: веер льдинок, при приближении — нова и телепорт */
AI.frostmage=(m,dt,dx,dy,dist)=>{
  m.nv=(m.nv||0)-dt;
  if(dist<48&&m.nv<=0){
    m.nv=rnd(5,7);sfx('fire');for(let i=0;i<10;i++)shoot('m',m.x,m.y,i/10*6.283,75,m.dmg*.55,{type:'ice',r:3,life:1.4});
    const a=Math.atan2(dy,dx)+Math.PI+rnd(-.5,.5),nx=m.x+Math.cos(a)*70,ny=m.y+Math.sin(a)*70;
    if(!blockedAt(nx,ny,6)){burst(m.x,m.y,'#9af0ff',10,70);m.x=nx;m.y=ny;burst(m.x,m.y,'#9af0ff',10,70)}
  }
  AI.icecaster(m,dt,dx,dy,dist);
};
/* огонёк: после сближения взрывается */
AI.wisp=(m,dt,dx,dy,dist)=>{
  if(m.fuse>0){
    m.fuse-=dt;m.tele=.1;
    if(m.fuse<=0){window.__gornEnemyBlast(m);boomFx(m.x,m.y);G.shake=Math.max(G.shake,3);sfx('boom');if(Math.hypot(P.x-m.x,P.y-m.y)<34)hurtPlayer(m.dmg*1.6,m.x,m.y,{src:__gornT(934)+((m.d&&m.d.n)||__gornT(935))});m.hp=0;killMon(m)}
    return;
  }
  const a=Math.atan2(dy,dx)+Math.sin(m.t*5)*1.1;moveEnt(m,Math.cos(a)*m.sp*dt,Math.sin(a)*m.sp*dt,true);
  if(dist<26)m.fuse=.7;
};
/* тень: исчезает (неуязвима) и появляется, чтобы выстрелить веером */
AI.shadecast=(m,dt,dx,dy,dist)=>{
  const ph=(m.t*.55)%3;m.hidden=ph>1.8;m.alpha=m.hidden?.25:1;
  if(dist<64)steer(m,dt,P.x,P.y,m.sp,true);else if(dist>110)steer(m,dt,P.x,P.y,m.sp);
  if(!m.hidden&&m.cd<=0&&los(m.x,m.y,P.x,P.y)){m.cd=rnd(2.2,3);m.tele=.25;sfx('fire');const a=Math.atan2(dy,dx);for(let i=-2;i<=2;i++)shoot('m',m.x,m.y,a+i*.22,82,m.dmg*.6,{type:'magic',r:3,life:2.2})}
};
/* голем: периодически покрывается кристаллической бронёй */
{const og=AI.golem;AI.golem=(m,dt,dx,dy,dist)=>{
  m.armorT=(m.armorT||0)-dt;m.agolem=(m.agolem===undefined?rnd(3,5):m.agolem)-dt;
  if(m.agolem<=0){m.agolem=rnd(6,8);m.armorT=2.5;burst(m.x,m.y,'#9af0ff',14,60)}
  if(m.armorT>0&&Math.random()<.4)burst(m.x+rnd(-6,6),m.y+rnd(-8,6),'#ffffff',1,20);
  og(m,dt,dx,dy,dist);
}}

AI.ambush=(m,dt,dx,dy,dist)=>{
  if(m.state==='hide'||m.state==='wait'){
    if(dist>76){m.hidden=true;m.alpha=.18;return}
    m.hidden=false;m.alpha=1;
    if(m.cd>0){steer(m,dt,P.x,P.y,m.sp*.45);return}
    m.state='tele';m.st=.34*TM();m.tele=.34*TM();
    m.ax=dx/(dist||1);m.ay=dy/(dist||1);sfx('fire');return;
  }
  if(m.state==='tele'){
    m.hidden=false;m.alpha=1;m.st-=dt;m.ax=dx/(dist||1);m.ay=dy/(dist||1);
    if(m.st<=0){m.state='dash';m.st=.24*TM();m.tele=0}
  }else if(m.state==='dash'){
    moveEnt(m,m.ax*m.sp*3.2*dt,m.ay*m.sp*3.2*dt);m.st-=dt;
    if(m.st<=0){m.state='recover';m.st=.55;m.cd=rnd(1.5,2)}
  }else if(m.state==='recover'){
    m.hidden=false;m.alpha=1;m.st-=dt;
    if(m.st<=0){m.state='hide';if(dist>92){m.hidden=true;m.alpha=.18}else m.alpha=.65}
  }
};
AI.spit=(m,dt,dx,dy,dist)=>{
  const see=los(m.x,m.y,P.x,P.y);
  if(dist>115||!see)steer(m,dt,P.x,P.y,m.sp);
  else if(dist<58)steer(m,dt,P.x,P.y,m.sp,true);
  else{const a=Math.atan2(dy,dx)+Math.PI/2,s=Math.sin(m.t*1.6)>0?1:-1;moveEnt(m,Math.cos(a)*m.sp*.8*dt*s,Math.sin(a)*m.sp*.8*dt*s)}
  if(m.cd<=0&&see&&dist<150){m.cd=rnd(1.6,2.2);m.tele=.2;sfx('shoot');shoot('m',m.x,m.y-2,Math.atan2(dy,dx)+rnd(-.08,.08),90,m.dmg,{type:'slime',r:3,life:2})}
};
let packGridTime=-1,packGrid=null;
AI.packx=(m,dt,dx,dy,dist)=>{
  m.sp0=m.sp0||m.sp;
  if(packGridTime!==G.time){
    packGridTime=G.time;packGrid=new Map();
    for(const o of G.mons)if(o.k===m.k&&!o.dead){
      const k=Math.floor(o.x/90)+','+Math.floor(o.y/90);let b=packGrid.get(k);
      if(!b)packGrid.set(k,b=[]);b.push(o);
    }
  }
  let n=0;const gx=Math.floor(m.x/90),gy=Math.floor(m.y/90);
  for(let oy=-1;oy<=1;oy++)for(let ox=-1;ox<=1;ox++){
    const b=packGrid.get((gx+ox)+','+(gy+oy));if(b)for(const o of b)if(o!==m&&Math.hypot(o.x-m.x,o.y-m.y)<90)n++;
  }
  m.sp=m.sp0*(1+Math.min(.45,.15*n));
  AI.lunge(m,dt,dx,dy,dist);
};

function pickEnding(){
  const s=S||{},built=Object.keys(P.built||{}).filter(k=>P.built[k]).length;
  const t={gold:P.gold,buy:s.buy||0,clr:s.clr||0,fl:s.fl||0,skip:s.skip||0,deaths:s.deaths||0,nm:s.nm||0,nb:s.nb||0,pot:s.nPot||0,bless:s.nBless||0,bnt:s.nBnt||0,ref:s.nRef||0,rmax:s.rfMax||0,nh:!!s.nh};
  const rich=Math.round(10000*(DF.m.coin||1)),chapel=!!(P.built&&P.built.chapel);
  const clean=t.clr>=12&&t.skip<=15,rushed=t.fl>=12&&t.clr<=2,bowy=t.nb>=60&&t.nb>=2*t.nm,swordy=t.nm>=60&&t.nm>=3*t.nb;
  /* от самых редких и труднодостижимых к самым обычным: первая подошедшая побеждает */
  const legend=swordy&&(s.rfMax||0)>=16;
  /* сначала три самые редкие, затем плохие концовки, затем хорошие; «Последняя перековка» выше «Возвращения домой», «Клинок героя» предпоследний, «Тихое возвращение» последнее.
     У плохих исключены условия хороших «двойников», чтобы все концовки оставались достижимыми */
  const order=[
   ['untouched',t.deaths===0&&t.pot<=15],
   ['ghost_arrow',bowy&&t.nh],
   ['hunter_chief',clean&&t.bnt>=6],
   ['siege_fall',rushed&&built<3],
   ['gold_betray',t.gold>=rich&&t.buy<40],
   ['cursed',t.deaths>=6&&!(chapel&&t.bless>=2)],
   ['gold_thanks',t.gold>=rich&&t.buy>=40],
   ['saint',t.deaths>=6&&chapel&&t.bless>=2],
   ['siege_hold',rushed&&built>=3],
   ['empty_abyss',clean],
   ['last_arrow',bowy],
   ['vials',t.deaths===0],
   ['blade_alone',swordy&&!legend],
   ['smith_tired',t.ref>=120],
   ['homecoming',built>=3],
   ['blade_legend',legend],
   ['quiet',true]
  ];
  const id=(order.find(o=>o[1])||order[order.length-1])[0];

}

function roomSpots(r,n){
  const out=[];let tr=0;

    const tx=r.x+1+((Math.random()*Math.max(1,r.w-2))|0),ty=r.y+1+((Math.random()*Math.max(1,r.h-2))|0);
    if(tileAt(G.map,tx,ty)!==TL.FLOOR)continue;
    const x=tx*TS+8,y=ty*TS+8;
    if(out.some(p=>Math.hypot(p.x-x,p.y-y)<26))continue;

const tierOf=t=>typeof DF.chest==='function'?DF.chest(t,G.depth):t;

  if(!M||!M.rooms||M.boss||G.depth<2)return;

  const cand=M.rooms.filter(r=>!r.start&&!r.arena&&!r.exit&&r.w>=5&&r.h>=4&&!taken(r)).sort(()=>Math.random()-.5);
  if(!cand.length)return;
  const r=cand[0];let q=Math.random();
  /* границы событий: ловушка | сокровищница | алтарь выбора (его доля зависит от сложности) */
  const aSh=Math.max(.05,Math.min(.6,.33+(DF.m.altD||0))),tB=(1-aSh)*.35/.67,vB=1-aSh;
  if(forceT)q=(tB+vB)/2;

  }

    if(tileAt(M,r.cx,r.cy)!==TL.FLOOR){c.x=sp.x;c.y=sp.y}

    const list=[];

/* ---------- 10. Деревня: день и ночь ---------- */
function drawTown(ctx,time){

/* ---------- 17. Погода и частицы окружения ---------- */
const WX={p:[],key:null,cx:0,cy:0,t:0};
function wxKey(){
  const M=G.map;if(!M)return null;

  return 'b'+(M.skin!=null?M.skin:M.biome);
}
function wxMake(key){
  const p=[],add=(n,f)=>{for(let i=0;i<n;i++)p.push(f())};
  const R=rf;
  if(window.wxSkin&&window.wxSkin(key,p,add,R))return p;

  else if(key==='b1'){add(7,()=>({k:'fog',x:R(0,VW),y:R(0,VH),vx:R(4,10)*(Math.random()<.5?-1:1),vy:R(-1,1),r:R(45,85),z:.2,ph:R(0,6.3),a:R(.05,.1)}));add(14,()=>({k:'dust',x:R(0,VW),y:R(0,VH),vx:R(-2,2),vy:R(-1,2),z:.5,ph:R(0,6.3),a:.3}))}
  else if(key==='b2')add(36,()=>({k:'ember',x:R(0,VW),y:R(0,VH),vx:R(-6,6),vy:-R(14,36),z:R(.4,1),ph:R(0,6.3),a:R(.5,.95)}));
  else if(key==='b3')add(70,()=>({k:'snow',x:R(0,VW),y:R(0,VH),vx:R(-8,-2),vy:R(14,30),z:R(.3,1),ph:R(0,6.3),a:R(.5,.95)}));
  else if(key==='b4')add(32,()=>({k:'glint',x:R(0,VW),y:R(0,VH),vx:R(-2,2),vy:R(-3,2),z:R(.3,.8),ph:R(0,6.3),a:1}));
  else if(key==='tday')add(22,()=>({k:'pollen',x:R(0,VW),y:R(0,VH),vx:R(2,8),vy:R(-2,3),z:.7,ph:R(0,6.3),a:R(.4,.8)}));
  else if(key==='tfly')add(20,()=>({k:'fly',x:R(0,VW),y:R(0,VH),vx:R(-5,5),vy:R(-4,4),z:.8,ph:R(0,6.3),a:1}));
  return p;
}
function wxDraw(ctx,time){

  const dx=G.cam.x-WX.cx,dy=G.cam.y-WX.cy;WX.cx=G.cam.x;WX.cy=G.cam.y;

    else if(p.k==='snow'){ctx.globalAlpha=p.a;ctx.fillStyle='#f4fbff';ctx.fillRect(x,y,p.z>.7?2:1,p.z>.7?2:1)}
    else if(p.k==='ember'){ctx.globalCompositeOperation='lighter';ctx.globalAlpha=p.a*(.5+.5*Math.sin(time*12+p.ph));ctx.fillStyle=['#ff9a3a','#ffd84a','#ff5a1a'][(p.ph|0)%3];ctx.fillRect(x,y,p.z>.7?2:1,1);ctx.globalCompositeOperation='source-over'}
    else if(p.k==='glint'){const a=.5+.5*Math.sin(time*3+p.ph*3);if(a>.4){ctx.globalCompositeOperation='lighter';ctx.globalAlpha=a;ctx.fillStyle=p.ph>3?'#e0b0ff':'#9af0ff';ctx.fillRect(x,y,1,1);if(a>.85){ctx.fillRect(x-1,y,3,1);ctx.fillRect(x,y-1,1,3)}ctx.globalCompositeOperation='source-over'}}
    else if(p.k==='fog'){const g=ctx.createRadialGradient(x,y,2,x,y,p.r);g.addColorStop(0,'rgba(170,180,210,'+p.a+')');g.addColorStop(1,'rgba(170,180,210,0)');ctx.globalAlpha=1;ctx.fillStyle=g;ctx.fillRect(x-p.r,y-p.r,p.r*2,p.r*2)}
    else if(p.k==='fly'){p.vx+=Math.sin(time*2+p.ph)*.3;p.vy+=Math.cos(time*2.3+p.ph)*.3;const a=.35+.65*Math.max(0,Math.sin(time*2.5+p.ph*2));ctx.globalCompositeOperation='lighter';
      const g=ctx.createRadialGradient(x,y,0,x,y,5);g.addColorStop(0,'rgba(210,255,120,'+a*.7+')');g.addColorStop(1,'rgba(210,255,120,0)');ctx.fillStyle=g;ctx.fillRect(x-5,y-5,10,10);ctx.globalAlpha=a;ctx.fillStyle='#f4ffb0';ctx.fillRect(x,y,1,1);ctx.globalCompositeOperation='source-over'}
  }
  ctx.restore();
}
{

{

    '@keyframes gornCoinFly{0%{opacity:0;transform:translateY(7px) scale(.92)}18%{opacity:1}100%{opacity:0;transform:translateY(-26px) scale(1.04)}}'+
    '#gold.gorn-gold-spend{animation:gornGoldPulse .42s ease-out}'+
    '.gorn-coin-loss{position:fixed;z-index:10020;display:flex;align-items:center;gap:4px;padding:4px 7px;border:1px solid rgba(255,216,74,.45);border-radius:6px;background:rgba(12,14,18,.94);color:#ffd84a;font:600 12px system-ui,sans-serif;pointer-events:none;animation:gornCoinFly .72s ease-out forwards}'+
    '.gorn-coin-loss img{width:14px;height:14px;image-rendering:pixelated}'+
    '@media(prefers-reduced-motion:reduce){#gold.gorn-gold-spend,.gorn-coin-loss{animation:none}.gorn-coin-loss{opacity:.95}}';

  function coinSpendFx(amount){

    fx.innerHTML=ic('coin')+'<span>−'+value.toLocaleString(window.__gornLocale)+'</span>';
    fx.style.left=Math.max(8,Math.min(innerWidth-100,rect.right-34))+'px';fx.style.top=Math.max(8,rect.top-4)+'px';
    document.body.appendChild(fx);setTimeout(()=>fx.remove(),800);
  }
  Object.defineProperty(P,'gold',{configurable:true,enumerable:true,get(){return goldValue},set(value){
    const before=Number(goldValue),after=Number(value);goldValue=value;
    if(goldFxReady&&Number.isFinite(before)&&Number.isFinite(after)&&after<before)try{coinSpendFx(before-after)}catch(e){}
  }});
  const _startGameGoldFx=startGame;
  startGame=function(){goldFxReady=false;const result=_startGameGoldFx.apply(this,arguments);goldFxReady=true;return result};
}
})();

<script>
/* ===================================================================
   ПАТЧ 6 · торговец-мститель, Очки Памяти, ледяной каток, финальный босс,
   время на слоте, застрявшие предметы
   =================================================================== */
(function(){
/* ---------- 1. Разъярённый торговец: первый удар отбрасывает без урона ---------- */
{
  const _hp=hurtPlayer;
  hurtPlayer=function(dmg,sx,sy,o){
    const m=o&&o.mon;
    if(m&&m.k==='wmerch'&&!m.kbDone){
      if(P.inv>0||P.dash>0||G.dead)return;
      m.kbDone=true;
      const d=Math.hypot(P.x-m.x,P.y-m.y)||1;
      P.kx=(P.x-m.x)/d*430;P.ky=(P.y-m.y)/d*430;P.inv=.5;P.flash=.12;
      sfx('boom');G.shake=Math.max(G.shake,6);burst(P.x,P.y,'#ffe8a0',12,90);addText(P.x,P.y-12,__gornT(1598),'#ffd84a');
      m.hitCd=1.1;
      return;
    }
    return _hp.apply(this,arguments);
  };
}

AI.angry=function(m,dt,dx,dy,dist){
  m.sp=m.d.sp*(P.active==='ranged'?1.2:1);
  if(dist>m.r*.8+P.r-2)steer(m,dt,P.x,P.y,m.sp);
};

/* ---------- 2. Предметы, застрявшие в стенах ---------- */
{
  const _ud=updateDrops;
  updateDrops=function(dt){
    if(G.map&&G.drops){
      for(const d of G.drops){
        if(!blockedAt(d.x,d.y,1))continue;
        let ok=false;
        for(let rad=3;rad<=160&&!ok;rad+=3)for(let k=0;k<16;k++){
          const a=k/16*6.283,nx=d.x+Math.cos(a)*rad,ny=d.y+Math.sin(a)*rad;
          if(!blockedAt(nx,ny,4)){d.x=nx;d.y=ny;d.vx=d.vy=0;ok=true;break}
        }
        if(!ok){d.x=P.x;d.y=P.y;d.vx=d.vy=0}
      }
    }
    return _ud.apply(this,arguments);
  };
}

/* Memory Glasses marker is drawn with the base minimap repaint. */
/* ---------- 4. Время на слоте (Д:Ч:М:С) ---------- */
{
  let PT_SLOT=-1;
  const st=document.createElement('style');
  st.textContent='.slotcard .si.tm{font-family:var(--f-mono,monospace);font-size:12px;opacity:.8;margin-top:4px;letter-spacing:.4px}';
  document.head.appendChild(st);
  const fmt=t=>{t=Math.max(0,Math.floor(t||0));const d=Math.floor(t/86400),h=Math.floor(t%86400/3600),m=Math.floor(t%3600/60),s=t%60,p=n=>(n<10?'0':'')+n;return d+':'+p(h)+':'+p(m)+':'+p(s)};
  const slotT=n=>{try{const d=JSON.parse(localStorage.getItem('gorn_s'+n)||'null');if(!d)return 0;return d.pt!=null?d.pt:(d.t||0)}catch(e){return 0}};
  const _sg=startGame;
  startGame=function(){const r=_sg.apply(this,arguments);try{if(S&&S.pt==null)S.pt=S.t||0}catch(e){}PT_SLOT=SLOT;return r};
  const _ot=openTitle;
  openTitle=function(){
    if(PT_SLOT>=0){try{saveS()}catch(e){}}
    PT_SLOT=-1;

      document.querySelectorAll('#dlg .slotcard[data-slot]').forEach(c=>{

      });

  setInterval(()=>{

  },1000);
  window.addEventListener('beforeunload',()=>{try{if(PT_SLOT>=0)saveS()}catch(e){}});
}

/* ---------- 5. Подсказки к новым характеристикам ---------- */
TIPDB.unshift(
 [/(?:защита от дальних)|(?:ranged defense)/,__gornT(1600),'armor','shield',__gornT(1601)],
 [/(?:скорость стрелы)|(?:arrow speed)/,__gornT(373),'weapon','arrow',__gornT(1602)]
);

/* ---------- 6. Ледяной босс: каток с отскоками ---------- */
{
  const iceSmall=()=>G.mons.filter(x=>x.small&&(x.k==='frostwolf'||x.k==='frostbat')&&!x.dead).length;
  const startSlide=(m,dx,dy,dist)=>{
    m.state='slideTele';m.st=.7*TM();m.tele=.7*TM();m.ax=dx/dist;m.ay=dy/dist;
    say(__gornT(1603),'bad');sfx('fire');
  };
  AI.frostlord=(m,dt,dx,dy,dist)=>{
    if(!m.awake)return;
    const f=m.hp/m.maxHp;m.ph2=m.ph2||0;m.bc=(m.bc||0)-dt;
    if(m.state==='slideTele'){
      m.st-=dt;m.ax=dx/dist;m.ay=dy/dist;
      if(m.st<=0){m.state='slide';m.sT=0;m.sdx=m.ax;m.sdy=m.ay;m.tele=0;m.bc=0}
      return;
    }
    if(m.state==='slide'){
      m.sT+=dt;m.kx=m.ky=0;
      const T=3,v=215*Math.max(0,1-m.sT/T),r=m.r*.8;
      let nx=m.sdx*v*dt,ny=m.sdy*v*dt,bounced=false;
      if(blockedAt(m.x+nx,m.y,r)){m.sdx=-m.sdx;bounced=true;nx=0}
      if(blockedAt(m.x,m.y+ny,r)){m.sdy=-m.sdy;bounced=true;ny=0}
      m.x+=nx;m.y+=ny;
      if(Math.random()<.5)G.parts.push({x:m.x+rnd(-6,6),y:m.y+rnd(-2,6),vx:rnd(-20,20),vy:rnd(-20,20),life:.35,c:'#cfeaff',s:2});
      if(bounced&&m.bc<=0){
        m.bc=.2;G.shake=Math.max(G.shake,4);sfx('boom');burst(m.x,m.y,'#bfe8ff',14,100);
        if(iceSmall()<8){
          for(let i=0;i<2;i++){
            const s=spawnMon(i?'frostbat':'frostwolf',m.x+rnd(-8,8),m.y+rnd(-8,8),false,true);
            s.awake=true;s.hitCd=.5;s.kx=rnd(-50,50);s.ky=rnd(-50,50);
          }
        }
      }
      if(m.sT>=T||v<6){m.state='chase';m.cd=1.4;G.shake=Math.max(G.shake,3)}
      return;
    }
    if((m.ph2<1&&f<.66)||(m.ph2<2&&f<.33)){m.ph2++;for(let k=0;k<2;k++){const s=spawnMon('frostwolf',m.x+rnd(-20,20),m.y+rnd(-20,20),false);s.awake=true;s.hp*=.7}say(__gornT(522),'bad')}
    if(!m.slid30&&f<=.3&&(m.state==='wait'||m.state==='chase')){m.slid30=1;startSlide(m,dx,dy,dist);return}
    m.st-=dt;
    if(m.state==='wait'||m.state==='chase'){
      m.state='chase';if(dist>30)steer(m,dt,P.x,P.y,m.sp);
      if(m.cd<=0){
        m.cd=rnd(2.2,3);m.phase++;
        if(f<.85&&Math.random()<.22){startSlide(m,dx,dy,dist);return}
        sfx('fire');const a=Math.atan2(dy,dx);
        if(m.phase%3===0){m.state='tele';m.st=.6*TM();m.tele=.6*TM();m.ax=dx/dist;m.ay=dy/dist}
        else if(m.phase%3===1){for(let i=-3;i<=3;i++)shoot('m',m.x,m.y,a+i*.17,90,m.dmg*.7,{type:'ice',r:3,life:2.4})}
        else{const n=12;for(let i=0;i<n;i++)shoot('m',m.x,m.y,i/n*6.283+m.t,70,m.dmg*.6,{type:'ice',r:3,life:2.6})}
      }
    }else if(m.state==='tele'){if(m.st<=0){m.state='dash';m.st=.45;m.tele=0}}
    else if(m.state==='dash'){moveEnt(m,m.ax*m.sp*4.2*dt,m.ay*m.sp*4.2*dt);if(m.st<=0){m.state='chase';G.shake=5}}
  };
}

/* ---------- 7. Финальный босс: Страж бездны ---------- */
MUS.tense={bpm:46,wave:'sawtooth',root:49,scale:[0,0,1,0,6,0,1,0],bass:[0,1],vol:.028,sparse:.3};
MUS.battle={bpm:156,wave:'sawtooth',root:82.4,scale:[0,0,3,0,7,6,3,0,12,10,7,6],bass:[0,0,-2,-4],vol:.034,sparse:.12};
G.lasers=[];
const segInter=(ax,ay,bx,by,cx,cy,dx,dy)=>{
  const d=(bx-ax)*(dy-cy)-(by-ay)*(dx-cx);if(Math.abs(d)<1e-9)return false;
  const t=((cx-ax)*(dy-cy)-(cy-ay)*(dx-cx))/d,u=((cx-ax)*(by-ay)-(cy-ay)*(bx-ax))/d;
  return t>=0&&t<=1&&u>=0&&u<=1;
};
const lEnds=L=>{const hx=Math.cos(L.ang)*L.len/2,hy=Math.sin(L.ang)*L.len/2;return[L.x-hx,L.y-hy,L.x+hx,L.y+hy]};
const distSeg=(px,py,L)=>{
  const [x0,y0,x1,y1]=lEnds(L),dx=x1-x0,dy=y1-y0,l2=dx*dx+dy*dy||1;
  const t=Math.max(0,Math.min(1,((px-x0)*dx+(py-y0)*dy)/l2));
  return Math.hypot(px-(x0+dx*t),py-(y0+dy*t));
};
window.drawLasers=function(ctx,cx,cy){
  if(!G.lasers||!G.lasers.length)return;
  const tm=performance.now()/1000;
  for(const L of G.lasers){
    const [ax,ay,bx,by]=lEnds(L),x0=ax-cx,y0=ay-cy,x1=bx-cx,y1=by-cy;

}

const WID=['hp','xp','gold','where','mini','weps','stock','spec','log'];

function load(){

  try{const o=JSON.parse(localStorage.getItem(KEY)||'null');
    if(o&&typeof o==='object')for(const k of WID)if(DEF[k].v.some(x=>x.id===o[k]))c[k]=o[k]}catch(e){}
  return c;

let applied=null,editing=false;

/* ---------- зоны экрана и родные элементы ---------- */

for(const k of ['bc','ml','mr']){const d=el('div','hud hud-'+k);stage.appendChild(d);Z[k]=d}
Z.hot.style.order=99;
const whereEl=$('where');
let todEl=$('tod');
if(!todEl){todEl=el('span','todb');todEl.id='tod';whereEl.insertAdjacentElement('afterend',todEl)}
const potsC=$('pots').parentElement,arrsC=$('arrs').parentElement,specC=$('spec'),oldCounts=q('.counts');
const stockW=el('div','counts');stockW.id='cw-stock';stockW.append(potsC,arrsC);
const specW=el('div','counts');specW.id='cw-spec';specW.append(specC);

 hp:[[q('.hud-l .meter'),0]],
 xp:[[q('.hud-l .meter.thin'),0],[$('lvt'),1]],

}

/* ---------- перезарядка приёма: сколько прошло ---------- */
const spcV=()=>{if(editing&&!(P.specCd>0)){const t=(performance.now()/1000)%6;return t<5?5-t:0}return P.specCd||0};
let sMax=0,sPrev=0,sFrac=1;
function specTick(){
  const c=Math.max(0,spcV()||0);
  if(c>sPrev+.01)sMax=c;
  sPrev=c;sFrac=c<=0?1:(sMax>0?clamp(1-c/sMax,0,1):0);

 'hp.seg':{mk(){const d=el('div','cw cw-seg');d.innerHTML='<div class="sg">'+'<i></i>'.repeat(10)+'</div><span class="sgt"></span>';return d},

   if(d._k!==k){d._k=k;const is=d.querySelectorAll('.sg i');for(let i=0;i<is.length;i++)is[i].style.setProperty('--f',(clamp(f*10-i,0,1)*100).toFixed(0)+'%');d.classList.toggle('low',f<.3)}
   tx(d.lastChild,String(Math.ceil(P.hp)))}},
 'hp.orb':{mk(){const d=el('div','cw cw-orb');d.innerHTML='<span></span>';return d},

   if(d._k!==k){d._k=k;d.style.setProperty('--p',(f*100).toFixed(1)+'%');d.classList.toggle('low',f<.3)}
   tx(d.firstChild,String(Math.ceil(P.hp)))}},
 'xp.ring':{mk(){const d=el('div','cw cw-ring');d.innerHTML=__gornT(1779);return d},
  upd(d){const k=Math.round(xpF()*1000);if(d._k!==k){d._k=k;d.style.setProperty('--p',(k/10).toFixed(1)+'%')}tx(d.firstChild.lastChild,String(P.lvl))}},
 'xp.edge':{mk(){const d=el('div','cw cw-edge');d.innerHTML='<i></i><span></span>';return d},

/* ---------- применение выбора ---------- */
function applyCfg(c){
  applied=c;
  for(const k of WID){
    const v=DEF[k].v.find(x=>x.id===c[k])||DEF[k].v[0];
    stage.setAttribute('data-h-'+k,v.id);
    const natOn=!v.cus&&!!v.z;
    for(const [e,off] of NAT[k]){
      if(!e)continue;
      if(natOn){e.style.display='';place(e,v.z,k,off)}else e.style.display='none';
    }
    for(const ck in CUS){
      if(ck.split('.')[0]!==k)continue;
      const cw=CUS[ck];
      if(v.cus===ck){
        if(!cw.el)cw.el=cw.mk();
        if(!cw.on){cw.on=true;if(cw.init)cw.init(cw.el)}
        cw.el.style.display='';
        if(v.z==='abs'){if(cw.el.parentElement!==stage)stage.appendChild(cw.el)}
        else place(cw.el,v.z,k,0);
      }else if(cw.el){cw.on=false;cw.el.style.display='none'}
    }
  }
}
const tr=()=>window.__tr||{};
let btn=null,btnShown=null;

  for(const ck in CUS){const cw=CUS[ck];if(cw.on&&cw.el)cw.upd(cw.el)}
  if(btn){const sh=!tr().on;if(btnShown!==sh){btnShown=sh;btn.style.display=sh?'':'none'}}
}
{
  const _uh=updateHud;
  updateHud=function(){_uh.apply(this,arguments);try{tick()}catch(e){console.error(__gornT(1783),e)}};
  /* значки «над героем» и «вокруг героя» рисуются прямо на поле */
  const _r=render;
  render=function(ctx,time){
    _r.apply(this,arguments);
    try{overlay(ctx,time)}catch(e){}
  };
}
function overlay(ctx,time){
  const c=applied;
  if(!c||!G.map||G.dead||c.hp!=='head')return;
  const x=Math.round(P.x-Math.floor(G.cam.x)),y=Math.round(P.y-Math.floor(G.cam.y));
  if(c.hp==='head'){
    const w=22,h=3,bx=x-w/2,by=y+13,f=hpF();
    ctx.fillStyle='#000';ctx.fillRect(bx-1,by-1,w+2,h+2);
    ctx.fillStyle='#3a1210';ctx.fillRect(bx,by,w,h);
    ctx.fillStyle=f<.3?'#ff5a4a':'#d8483a';ctx.fillRect(bx,by,Math.round(w*f),h);
  }
}

function rockSprite(seed,S){
  const key=seed+'|'+S;let c=RC.get(key);if(c)return c;
  c=document.createElement('canvas');c.width=c.height=S;const g=c.getContext('2d');
  const R=rngS(seed>>>0),ph=[R()*6,R()*6],cc=S/2-.5,base=S/2-1;
  const inside=(x,y)=>{const dx=x-cc,dy=y-cc,a=Math.atan2(dy,dx);return Math.hypot(dx,dy)<=base*(.8+.14*Math.sin(a*3+ph[0])+.08*Math.sin(a*5+ph[1]))};

  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    if(!inside(x,y))continue;

    const l=(-(x-cc)-(y-cc))/(S*1.1)+.5+(R()-.5)*.28;
    g.fillStyle=edge?((x-cc+y-cc)<0?pal[2]:pal[0]):pal[clamp(1+Math.floor(l*4.4),1,5)];

  RC.set(key,c);return c;
}

<script>
/* Restrained blade vortex: tapered steel crescents, short weapon echoes, no extra damage or flashes. */
window.__gornBladeVortex=function(g,x,y,icon){
  const s=P.spin;if(!s)return;
  const k=Math.max(0,Math.min(1,s.t/s.dur)),a=s.a0+s.turns*Math.PI*2*k;
  const fade=Math.min(1,k/.10,(1-k)/.16),r=s.r*.86;
  if(fade<=0)return;
  const reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  g.save();g.lineCap='round';
  // A tapered ribbon follows the blade, leaving the hero and arena readable.
  const ribbon=(head,radius,span,col,opacity)=>{
    for(let i=0;i<12;i++){
      const u=i/12,v=(i+1)/12,rr=radius*(.91+.09*v);
      g.beginPath();g.arc(x,y,rr,head-span+span*u,head-span+span*v+.025);
      g.lineWidth=.55+2.15*v;g.strokeStyle='rgba('+col+','+(opacity*fade*v*v)+')';g.stroke();
    }
  };
  ribbon(a,r,2.05,'190,223,245',.72);
  ribbon(a+Math.PI,r*.76,1.40,'221,196,137',.40);
  g.beginPath();g.arc(x,y,r,a-.46,a+.025);g.lineWidth=1.1;
  g.strokeStyle='rgba(244,251,255,'+(.92*fade)+')';g.stroke();
  // Short translucent blade echoes, not a solid glowing disc.
  const blade=(ang,alpha)=>{if(!icon)return;g.save();g.globalAlpha=alpha;
    g.translate(x+Math.cos(ang)*5,y+Math.sin(ang)*5);g.rotate(ang+Math.PI/4);
    g.scale(.79,.79);g.drawImage(icon,-3,-13);g.restore();};
  if(!reduced){blade(a-.48,.12*fade);blade(a-.24,.24*fade);}
  blade(a,1);
  if(!reduced)for(let i=0;i<3;i++){
    const p=(k*3+i/3)%1,ang=a-.4-i*1.9,rr=r*(.87+p*.16);
    g.fillStyle='rgba(221,238,246,'+(.48*fade*Math.sin(p*Math.PI))+')';
    g.fillRect(Math.round(x+Math.cos(ang)*rr),Math.round(y+Math.sin(ang)*rr),1.2,1.2);
  }
  g.restore();
};

const oldMons=updMons;updMons=function(){const r=G.mode==='dungeon'&&G.wanderRoom;if(!r)return oldMons.apply(this,arguments);const prev=new Map(G.mons.map(m=>[m,[m.x,m.y]]));const result=oldMons.apply(this,arguments);G.mons=G.mons.filter(m=>{if(m.k==='wmerch'||m.k==='wanderGuard'||!inside(r,m.x,m.y))return true;const p=prev.get(m);if(!p||inside(r,p[0],p[1])){
  // A mimic that pops inside the merchant's room gets struck down by the mercenary instead of just vanishing.
  if(m.k==='mimic'&&!m.dead){const guard=G.npcs.find(x=>x.kind==='wanderGuard');if(guard)addText(m.x,m.y-12,L('Наёмник убивает мимика!','The mercenary slays the mimic!'),'#ffe1aa');m.hp=0;killMon(m)}
  return false;
}m.x=p[0];m.y=p[1];m.kx=m.ky=0;return true});return result};
const back=window.__fxBack;window.__fxBack=function(ctx,cx,cy,t){if(back)back.apply(this,arguments);if(G.mode!=='dungeon'||!G.wanderRoom)return;const n=G.npcs.find(n=>n.kind==='wander');if(!n)return;const x=Math.round(n.x-cx),y=Math.round(n.y-cy);ctx.save();ctx.fillStyle='#362315';ctx.fillRect(x-13,y-15,2,19);ctx.fillRect(x+12,y-15,2,19);ctx.fillStyle='#513222';ctx.fillRect(x-15,y-17,30,7);ctx.fillStyle='#a64b37';ctx.fillRect(x-14,y-16,28,3);ctx.fillStyle='#dbc79c';for(let i=0;i<4;i++)ctx.fillRect(x-13+i*7,y-16,3,3);ctx.fillStyle='#7a522e';ctx.fillRect(x-12,y+5,24,3);ctx.restore()};
// Cat is visible only in the tutorial and its interaction bypasses no other tutorial actions.
const cat={x:4.5*TS,y:4.5*TS},hearts=[];

const catPress=press;press=function(k){if(k==='use'&&window.__gornPetCat())return;return catPress.apply(this,arguments)};
const nearest=nearestInteract;nearestInteract=function(){let b=nearest.apply(this,arguments);if(G.mode==='train'&&Math.hypot(P.x-cat.x,P.y-cat.y)<24&&(!b||Math.hypot(P.x-b.o.x,P.y-b.o.y)>Math.hypot(P.x-cat.x,P.y-cat.y)))return {o:cat,label:'Sakamivadik',act:window.__gornPetCat};return b};
const front=window.__fxFront;window.__fxBack=(function(prev){return function(ctx,cx,cy,t){if(prev)prev.apply(this,arguments);if(G.mode==='dungeon')drawCyberTrails(ctx,cx,cy)}})(window.__fxBack);
window.__fxFront=function(c,cx,cy,t){if(front)front.apply(this,arguments);if(G.mode==='town'&&G.map&&G.map.plots){const colors={inn:'#b96543',chapel:'#d8d4ba',vault:'#8999ac',lodge:'#76966c',pawn:'#ab8cbd',bureau:'#dfb96a',arena:'#82a6c4'};for(const id in colors){if(!P.built[id])continue;const p=G.map.plots[id];if(!p)continue;const x=Math.round((p.x+2.5)*TS-cx),y=Math.round((p.y+2)*TS-cy);c.fillStyle=colors[id];c.fillRect(x-7,y+3,4,5);c.fillStyle='#e9d5a1';c.fillRect(x-6,y+4,2,2)}}if(G.mode!=='train')return;const x=Math.round(cat.x-cx),y=Math.round(cat.y-cy);c.save();c.fillStyle='#252630';c.fillRect(x-7,y-4,13,6);c.fillRect(x-6,y-8,4,5);c.fillRect(x+1,y-8,4,5);c.fillRect(x+5,y-5,4,2);c.fillStyle='#999da5';c.fillRect(x-6,y-5,11,5);c.fillRect(x-5,y-8,3,3);c.fillRect(x+1,y-8,3,3);c.fillStyle='#e9d8d8';c.fillRect(x-3,y-3,2,1);c.fillRect(x+2,y-3,2,1);c.fillStyle='#10121a';c.fillRect(x-4,y-5,1,1);c.fillRect(x+3,y-5,1,1);c.restore();txt(x,y-12,'Sakamivadik','#e8e0c6',{size:6,bold:1});for(let i=hearts.length-1;i>=0;i--){const h=hearts[i],age=t-h.at;if(age>1.5){hearts.splice(i,1);continue}if(age<0)continue;const a=Math.max(0,1-age/1.5),hx=h.x-cx,hy=h.y-cy-age*13;c.save();c.globalAlpha=a;c.fillStyle='#ff9fc0';c.fillRect(hx-3,hy-2,2,2);c.fillRect(hx+1,hy-2,2,2);c.fillRect(hx-3,hy,6,2);c.fillRect(hx-2,hy+2,4,1);c.fillRect(hx-1,hy+3,2,1);c.restore()}};
