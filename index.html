<script>
(function(){'use strict';
const L=(r,e)=>window.__gornLang==='ru'?r:e;
const level=id=>window.__gornBuildingLevel(id);
const cooldown=()=>level('arena')>=2?390:450;
const makeOrder=()=>lootItem(Math.max(1,Math.min(25,Math.floor(P.lvl)||1)),2,Math.random()<.7?'sword':'bow');
const BUREAU_T=180,BUREAU_MUL=20; /* обновление раз в 3 минуты активной игры; награда x20 от цены продажи */
function bureauCount(){return level('bureau')>=2?4:3}
function bureau(){if(!P.bureau||!Array.isArray(P.bureau.orders))P.bureau={orders:[]};const B=P.bureau;if(!Number.isFinite(B.left)||B.left<=0||B.left>BUREAU_T)B.left=BUREAU_T;while(B.orders.length<bureauCount())B.orders.push(makeOrder());return B}
function refreshBureau(){const B=bureau(),n=bureauCount();B.orders=[];for(let i=0;i<n;i++)B.orders.push(makeOrder());B.left=BUREAU_T;saveGame()}
function arena(){if(!P.arena||typeof P.arena!=='object')P.arena={elapsed:0,killsAt:P.kills,levelAt:P.lvl};let a=P.arena;if(!Number.isFinite(a.elapsed))a.elapsed=0;if(!Number.isFinite(a.killsAt))a.killsAt=P.kills;if(!Number.isFinite(a.levelAt)||a.levelAt<1)a.levelAt=P.lvl;return a}
window.__gornBuildingPurchased=id=>{if(id==='arena')P.arena={elapsed:0,killsAt:P.kills,levelAt:P.lvl};if(id==='bureau'){P.bureau={orders:[],left:BUREAU_T};bureau()}};
function details(item){return item.rows.filter((r,i)=>i!==0&&r.l!==__gornT(397)&&r.l!==__gornT(400));}
function matches(order,e){
 if(!order||!e||e.t==='box'||(e.t!=='sword'&&e.t!=='bow')||e.t!==order.t)return false;
 const a=ITEM(order),b=ITEM(e);if(a.matKey!==b.matKey||a.sub!==b.sub)return false;
 const remaining=details(b).map(r=>r.l+'\u0000'+r.n);let n=0;
 for(const r of details(a)){const k=r.l+'\u0000'+r.n,i=remaining.indexOf(k);if(i>=0){remaining.splice(i,1);n++}}
 return n>=(level('bureau')>=3?1:2);
}
window.__gornBureauMatches=matches;
function timerChip(id,label,remain,total,readyText){
 const ready=remain<=0,pct=ready?100:Math.max(0,Math.min(100,100*(1-remain/total)));
 return '<div class="gorn-timer'+(ready?' ready':'')+'" id="'+id+'" data-total="'+total+'"><span class="gt-l">'+ic('clock')+esc(label)+'</span><b class="gt-v">'+(ready?esc(readyText||L('Готово','Ready')):fmt(remain))+'</b><i class="gt-bar"><u style="width:'+pct.toFixed(1)+'%"></u></i></div>';
}
function timerUpdate(id,remain,total,readyText){
 const el=document.getElementById(id);if(!el)return false;
 const ready=remain<=0,v=el.querySelector('.gt-v'),u=el.querySelector('.gt-bar u'),txt=ready?(readyText||L('Готово','Ready')):fmt(remain);
 if(v.textContent!==txt)v.textContent=txt;
 u.style.width=(ready?100:Math.max(0,Math.min(100,100*(1-remain/total)))).toFixed(1)+'%';
 el.classList.toggle('ready',ready);return true;
}
window.__gornOpenBureau=function(){
 if(!P.built.bureau||G.mode!=='town')return;
 const state=bureau(),needed=level('bureau')>=3?1:2;UI.open=true;
 const cards=state.orders.slice(0,bureauCount()).map((order,oi)=>{
  if(!order)return '<section class="gorn-order closed"><div class="go-stamp"><span>'+esc(L('СДАНО','FILED'))+'</span></div><small>'+esc(L('Новый заказ появится после обновления.','A new request arrives on refresh.'))+'</small></section>';
  const it=ITEM(order),rows=details(it),col=RCOL[it.rar]||'#9aa6b4',candidates=P.bag.map((e,i)=>({e,i})).filter(o=>matches(order,o.e));
  return '<section class="gorn-order" style="--rc:'+col+'"><div class="gorn-order-head"><img src="'+iconUrl(order)+'" alt=""><div><h3>'+esc(it.name)+'</h3><div class="go-tags"><span>'+esc(it.matName)+'</span><span>'+esc(it.sub)+'</span></div></div></div>'+
   '<div class="go-sub">'+esc(L('Нужны совпадения: ','Matches needed: ')+needed)+'</div><ul>'+rows.map(r=>'<li>'+esc(r.l+': '+r.n)+'</li>').join('')+'</ul>'+
   '<div class="go-sub">'+esc(L('Подходит из рюкзака','From your backpack'))+'</div>'+
   (candidates.length?candidates.map(({e,i})=>'<button class="btn primary go-give" data-noic="1" data-vact="bureauSubmit:'+oi+','+i+'"><span>'+esc(ITEM(e).name)+'</span><b>+'+(sellPrice(e)*BUREAU_MUL)+' '+ic('coin')+'</b></button>').join(''):'<div class="go-none">'+esc(L('Подходящего оружия нет','No matching weapon'))+'</div>')+'</section>';
 }).join('');
 showDlg('<div class="gorn-head"><div><h2>'+esc(L('Бюро находок','Lost & Found'))+' '+['','I','II','III'][level('bureau')]+'</h2><p class="hint">'+esc(L('Сдайте оружие того же материала и типа с совпадением не менее '+needed+' параметров из списка. Награда — x20 от цены продажи.','Hand in a weapon of the same material and exact subtype with at least '+needed+' matching details. Reward: 20× its sale price.'))+'</p></div>'+timerChip('gorn-bt',L('Обновление','Refresh'),state.left,BUREAU_T)+'</div><div class="gorn-orders">'+cards+'</div>'+vclose(),1,'wide gorn-service');saveGame();
};
function submit(oi,bi){
 if(!P.built.bureau||G.mode!=='town'||!Number.isInteger(oi)||!Number.isInteger(bi))return;
 const state=bureau(),limit=bureauCount(),e=P.bag[bi],order=state.orders[oi];if(oi<0||oi>=limit||!order||!matches(order,e))return;
 const paid=BUREAU_MUL*sellPrice(e),name=ITEM(e).name;P.bag.splice(bi,1);P.gold+=paid;state.orders[oi]=null;UI.sel=null;sfx('coin');say(L('Бюро находок: ','Lost & Found: ')+name+' +'+paid,'good');saveGame();window.__gornOpenBureau();
}
window.__gornArenaInfo=function(){const a=arena(),wait=cooldown(),need=(level('arena')>=2?12:15)*a.levelAt;return {wait,remaining:Math.max(0,wait-a.elapsed),need,kills:Math.max(0,P.kills-a.killsAt),baseLevel:a.levelAt}};
const fmt=t=>{t=Math.ceil(t);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')};
window.__gornOpenArena=function(){
 if(!P.built.arena||G.mode!=='town')return;
 const x=window.__gornArenaInfo(),ready=x.remaining<=0,good=ready&&x.kills>=x.need,n=level('arena')>=3?2:1;
 const kp=Math.min(100,100*x.kills/Math.max(1,x.need));
 const how=level('arena')>=2?L('Ожидание: 6:30 игрового времени.','Cooldown: 6:30 of play time.'):L('Ожидание: 7:30 игрового времени.','Cooldown: 7:30 of play time.');
 UI.open=true;showDlg('<div class="gorn-head"><div><h2>'+esc(L('Тренировочная арена','Training Arena'))+' '+['','I','II','III'][level('arena')]+'</h2><p class="hint">'+esc(how)+'</p></div>'+timerChip('gorn-at',L('Перезарядка','Cooldown'),x.remaining,x.wait,L('Готово','Ready'))+'</div>'+
  '<div class="gorn-arena-status"><div class="ga-row"><span>'+esc(L('Монстры побеждены','Monsters defeated'))+'</span><b>'+Math.min(x.kills,x.need)+' / '+x.need+'</b></div><i class="gt-bar big"><u style="width:'+kp.toFixed(1)+'%"></u></i>'+
  '<div class="ga-note">'+esc(good?L('Вы готовы к тренировке.','You are ready to train.'):!ready?L('Дождитесь окончания перезарядки.','Wait for the cooldown to finish.'):L('Победите ещё монстров.','Defeat more monsters.'))+'</div></div>'+
  '<div class="gorn-reward">'+esc(n===2?L('Награда: два уровня','Reward: two levels'):L('Награда: один уровень','Reward: one level'))+'</div>'+
  '<button class="btn primary big" data-noic="1" data-vact="arenaTrain"'+(good?'':' disabled')+'>'+esc(L('Тренироваться','Train'))+'</button>'+vclose(),1,'gorn-service');
};
function train(){
 if(!P.built.arena||G.mode!=='town')return;const x=window.__gornArenaInfo();if(x.remaining>0||x.kills<x.need)return;
 const n=level('arena')>=3?2:1;P.lvl+=n;P.baseHp+=10*n;P.xp=0;recalc();P.hp=Math.min(P.maxHp,P.hp+10*n);G.perkQ=(G.perkQ||0)+n;
 const a=arena();a.elapsed=0;a.killsAt=P.kills;a.levelAt=P.lvl;sfx('level');burst(P.x,P.y,'#ffe14a',22,100);say(L('Тренировка завершена! Уровень ','Training complete! Level ')+P.lvl+'!','good');saveGame();window.__gornOpenArena();
}
const oldAct=vAct;vAct=function(s){const str=String(s),colon=str.indexOf(':'),k=colon<0?str:str.slice(0,colon),arg=colon<0?'':str.slice(colon+1);if(k==='bureauSubmit'){const p=arg.split(',').map(Number);submit(p[0],p[1]);return}if(k==='arenaTrain'){train();return}return oldAct.apply(this,arguments)};
/* Таймеры бюро и арены идут в реальном времени, в том числе пока открыто любое меню. */
let gameOn=false,lastT=performance.now(),saveAcc=0,prevArena=null;
{const _sg=startGame;startGame=function(){gameOn=true;lastT=performance.now();prevArena=null;return _sg.apply(this,arguments)};
 const _ot=openTitle;openTitle=function(){gameOn=false;return _ot.apply(this,arguments)}}
setInterval(()=>{
 const now=performance.now(),dt=Math.min(1,(now-lastT)/1000);lastT=now;
 if(!gameOn||document.hidden||!G.map||!(G.mode==='town'||G.mode==='dungeon')||!(dt>0)||!P.built)return;
 try{
  if(P.built.bureau){const B=bureau();B.left-=dt;
   if(B.left<=0){const open=!!document.getElementById('gorn-bt');refreshBureau();if(open&&G.mode==='town')window.__gornOpenBureau()}
   else timerUpdate('gorn-bt',B.left,BUREAU_T)}
  if(P.built.arena){const a=arena();a.elapsed+=dt;const info=window.__gornArenaInfo();
   if(prevArena!==null&&prevArena>0&&info.remaining<=0&&document.getElementById('gorn-at')&&G.mode==='town')window.__gornOpenArena();
   else timerUpdate('gorn-at',info.remaining,info.wait,L('Готово','Ready'));
   prevArena=info.remaining}
  saveAcc+=dt;if(saveAcc>=10){saveAcc=0;saveGame()}
 }catch(e){console.error(e)}
},250);
window.addEventListener('beforeunload',()=>{if(P.built&&(P.built.arena||P.built.bureau))saveGame()});
const earlierFront=window.__fxFront;window.__fxFront=function(c,cx,cy,t){if(earlierFront)earlierFront.apply(this,arguments);if(G.mode!=='town'||!G.map||!G.map.plots)return;for(const id of ['bureau','arena']){if(!P.built[id])continue;const p=G.map.plots[id];if(!p)continue;const x=Math.round((p.x+2.5)*TS-cx),y=Math.round((p.y+1)*TS-cy);c.save();c.fillStyle='#29252a';c.fillRect(x-5,y-4,10,8);c.fillStyle=id==='bureau'?'#d8b66e':'#829eb0';c.fillRect(x-4,y-3,8,6);if(id==='bureau'){c.fillStyle='#f5e2b2';c.fillRect(x-2,y-2,4,4);c.fillStyle='#96784a';c.fillRect(x-1,y-1,2,1);c.fillRect(x-1,y+1,2,1)}else{c.fillStyle='#f0ead8';for(let i=0;i<4;i++){c.fillRect(x-3+i,y-2+i,1,1);c.fillRect(x+2-i,y-2+i,1,1)}c.fillStyle='#62452b';c.fillRect(x-3,y+1,2,1);c.fillRect(x+1,y+1,2,1)}c.restore()}};
})();
</script>

<script>
/* ===== SECRET TRUE ENDING · challenge and abandoned archive ===== */
(()=>{
 const C=window.__gornTrueCore,E=window.__gornTrueEndApi;
 if(!C||!E)return;
 const G=C.G,P=C.P,DF=C.DF,BUILD=C.BUILD;
 const tr=(ru,en)=>window.__gornLang==='ru'?ru:en;
 const escHtml=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const run={active:false,streak:0,expected:21,ready:false,bossDamaged:false,cheat:false};
 const resetRun=()=>{run.active=false;run.streak=0;run.expected=21;run.ready=false;run.bossDamaged=false;run.cheat=false};
 const prerequisites=()=>DF.id==='imp'&&E.ready()&&BUILD.every(b=>!!(P.built&&P.built[b.id]));
 const enter=window.enterDungeon;
 if(typeof enter==='function')window.enterDungeon=function(depth){
   depth=Number(depth);
   if(depth===21){run.active=true;run.streak=0;run.expected=21;run.ready=prerequisites();run.bossDamaged=false}
   else if(run.active&&depth!==run.expected)resetRun();
   return enter.apply(this,arguments);
 };
 const kill=window.killMon;
 if(typeof kill==='function')window.killMon=function(m){
   const depth=G.depth,eligible=run.active&&run.ready&&G.mode==='dungeon'&&depth>=21&&depth<=24&&depth===run.expected;
   const escaped=!!(m&&m.fRoll);
   const r=kill.apply(this,arguments);
   if(eligible){
     if(escaped){resetRun();return r}
     if(!G.mons.some(x=>!x.dead)){run.streak++;run.expected=depth+1}
   }
   return r;
 };
 const hitMon=window.hurtMon;
 if(typeof hitMon==='function')window.hurtMon=function(m){
   const before=m&&m.hp,r=hitMon.apply(this,arguments);
   if(run.active&&G.mode==='dungeon'&&G.depth>=25&&m&&m.k==='warden'&&before!==undefined&&m.hp<before)run.bossDamaged=true;
   return r;
 };
 const hp=window.hurtPlayer;
 if(typeof hp==='function')window.hurtPlayer=function(dmg,sx,sy,o){
   G.trueDamageSource=o&&o.mon&&o.mon.k==='warden'&&o.mon.boss?'warden':null;
   try{return hp.apply(this,arguments)}finally{G.trueDamageSource=null}
 };
 const die=window.playerDie;
 if(typeof die==='function')window.playerDie=function(){
   if(G.dead)return;
   if(P.bless>0){const r=die.apply(this,arguments);return r}
   const cheatValid=run.cheat&&G.mode==='dungeon'&&G.depth===25&&!!(G.map&&G.map.boss)&&!C.has();
   const valid=cheatValid||(run.active&&run.ready&&run.streak===4&&run.expected===25&&G.mode==='dungeon'&&G.depth===25&&DF.id==='imp'&&E.ready()&&BUILD.every(b=>!!(P.built&&P.built[b.id]))&&!run.bossDamaged&&G.trueDamageSource==='warden'&&!C.has());
   if(valid){
     run.active=false;G.dead=true;G.finaleBusy=true;G.paused=true;C.UI.open=true;
     const finish=()=>{E.markSeen();C.mark();G.dead=false;G.finaleBusy=false;G.paused=false;C.UI.open=false;if(window.hideDlg)window.hideDlg();if(window.goTown)window.goTown(true,true);C.restoreAbandonedTown();if(window.openTitle)window.openTitle()};
     window.showManga(E.pages,finish);return;
   }
   const r=die.apply(this,arguments);
   if(G.dead)resetRun();
   return r;
 };
 const start=window.startGame;
 if(typeof start==='function')window.startGame=function(cont){if(!cont)C.clear();resetRun();const r=start.apply(this,arguments);if(cont&&C.has()){if(window.hideDlg)window.hideDlg();C.restoreAbandonedTown();if(typeof saveGame==='function')saveGame()}return r};
 const dive=window.openDive;
 const stages=[
  ['Rootbound Hollow','Корневая впадина',2,'rock'],['Flooded Gallery','Затопленная галерея',3,'drop'],['Ashen Quarry','Пепельный карьер',4,'flame'],['Glasswind Ridge','Хребет стеклянного ветра',3,'gem'],['Heart’s Antechamber','Преддверие Сердца',5,'skull'],
  ['Bellfoundry Deep','Глубины колокольни',4,'bell'],['The Drowned Index','Утонувший архив',3,'key'],['Wolfglass Reach','Предел Волчьего стекла',5,'fang'],['Crown Ossuary','Костница короны',4,'antler'],['Pilgrim’s Spiral','Спираль паломника',3,'move'],['The Black Orchard','Чёрный сад',2,'thorn'],['Choir Without Light','Хор без света',5,'eye'],['The Last King’s Stair','Последняя лестница короля',4,'shieldsword'],['Beneath the Empty Throne','Под пустым троном',5,'vault']
 ];
 const installArchiveCss=()=>{if(document.getElementById('true-archive-css'))return;const st=document.createElement('style');st.id='true-archive-css';st.textContent=`.dive.true-archive-grid{display:grid;grid-template-columns:repeat(5,minmax(0,124px));justify-content:start;flex-wrap:unset}.true-archive-grid .btn.dv{cursor:default;min-width:0}.true-archive-grid .btn.dv.locked{opacity:.6}@media(max-width:520px){.true-archive-grid .btn.dv{padding:10px 4px}.true-archive-grid .btn.dv .rng{font-size:13px}}`;document.head.appendChild(st)};
 if(typeof dive==='function')window.openDive=function(){
   if(!C.has())return dive.apply(this,arguments);
   installArchiveCss();const ru=window.__gornLang==='ru';
   const rows=stages.map((a0,i)=>{const real=i<5&&typeof BIOMES!=='undefined'&&typeof FLOOR_INFO!=='undefined'&&BIOMES[i]&&FLOOR_INFO[i];
     const nm=real?BIOMES[i].name:(ru?a0[1]:a0[0]),st=real?FLOOR_INFO[i].st:a0[2],icn=real?FLOOR_INFO[i].ic:a0[3],lo=i*5+1;
     return '<button class="btn dv locked" type="button" aria-disabled="true" data-tn="'+escHtml(nm)+'" data-st="'+st+'" aria-label="'+escHtml(nm)+'">'+ic(icn,'')+'<span class="rng">'+lo+' – '+(lo+4)+'</span></button>'}).join('');
   const html='<h2>'+tr('Заблокированные глубины','Sealed depths')+'</h2><p class="hint">'+tr('Проходы обрушены, входов больше нет. Задержите курсор на значке: появится название места и сложность.','The passages have collapsed and none can be entered. Hold the cursor on an icon to see the area name and difficulty.')+'</p><div class="dive true-archive-grid">'+rows+'</div><button class="btn sm" id="true-archive-close" type="button">'+tr('Закрыть','Close')+'</button>';
   if(window.showDlg)window.showDlg(html,1,'dfwin');setTimeout(()=>{document.querySelectorAll('.true-archive-grid .dv').forEach(b=>{let tm=null,tip=null;const clr=()=>{clearTimeout(tm);if(tip){tip.remove();tip=null}};
    const show=()=>{clr();tip=document.createElement('div');tip.id='dvtip';const n=+b.dataset.st;tip.innerHTML='<b>'+b.dataset.tn+'</b><span class="st"><i>'+'★'.repeat(n)+'</i>'+'☆'.repeat(5-n)+'</span>';document.body.appendChild(tip);const r=b.getBoundingClientRect(),w=tip.offsetWidth,h=tip.offsetHeight;let left=Math.max(6,Math.min(innerWidth-w-6,r.left+r.width/2-w/2)),top=r.top-h-8;if(top<6)top=r.bottom+8;tip.style.left=left+'px';tip.style.top=top+'px'};
    b.addEventListener('mouseenter',()=>{clr();tm=setTimeout(show,1000)});b.addEventListener('mouseleave',clr);b.addEventListener('touchstart',()=>{clr();tm=setTimeout(show,600)},{passive:true});b.addEventListener('touchend',()=>setTimeout(clr,1500));b.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();clr()})})},0);if(window.say)window.say(tr('Мне там больше нечего делать.','There’s nothing left for me there.'),'');
 };
 document.addEventListener('click',ev=>{if(ev.target.closest&&ev.target.closest('#true-archive-close')){if(window.hideDlg)window.hideDlg();C.UI.open=false}});
 // Post-ending slot clicks must never resume the stale boss-floor state.
 document.addEventListener('click',ev=>{const card=ev.target.closest&&ev.target.closest('.slotcard[data-slot]');if(!card||(ev.target.closest&&ev.target.closest('.sx,.sren')))return;const n=Number(card.dataset.slot);if(!Number.isInteger(n)||!C.has(n))return;ev.preventDefault();ev.stopImmediatePropagation();SLOT=n;resetRun();if(typeof window.startGame==='function')window.startGame(true)},true);
 // Secret keyboard shortcut: type KLOSTYAN to credit every prerequisite and jump to Warden.
 {
  const cheatCode='KLOSTYAN', endingIds=['gold_thanks','gold_betray','siege_hold','siege_fall','hunter_chief','empty_abyss','untouched','vials','saint','cursed','ghost_arrow','last_arrow','blade_legend','blade_alone','homecoming','quiet','smith_tired'];
  const artifactIds=['hero','luck','rich','price','vision','used','silver','village','warrior','flee','exp','path','down','master','buff','tenants','sand'];
  let typed='';
  const activate=()=>{
   if(C.has())return;
   try{
    const seen=JSON.parse(localStorage.getItem('gorn_endings')||'{}');
    endingIds.forEach(id=>{seen[id]=seen[id]||Date.now();if(typeof ENSEEN!=='undefined')ENSEEN[id]=seen[id]});
    localStorage.setItem('gorn_endings',JSON.stringify(seen));
   }catch(e){}
   try{
    const arts=JSON.parse(localStorage.getItem('gorn_arts')||'{}');arts.own=arts.own||{};arts.off=arts.off||{};
    artifactIds.forEach(id=>{arts.own[id]=true});localStorage.setItem('gorn_arts',JSON.stringify(arts));
   }catch(e){}
   P.built=P.built||{};BUILD.forEach(b=>{P.built[b.id]=true});
   if(DF.id!=='imp')DF.set('imp');
   if(typeof recalc==='function')recalc();
   P.hp=P.maxHp;P.deepest=Math.max(P.deepest||1,25);
   run.active=true;run.streak=4;run.expected=25;run.ready=true;run.bossDamaged=false;run.cheat=true;
   G.trueDamageSource=null;G.dead=false;G.finaleBusy=false;G.paused=false;C.UI.open=false;
   if(window.hideDlg)window.hideDlg();
   if(typeof saveGame==='function')saveGame();
   if(typeof window.enterDungeon==='function')window.enterDungeon(25);
   if(window.say)window.say(tr('KLOSTYAN активирован: условия засчитаны. Позвольте боссу убить вас на этом этаже.','KLOSTYAN activated: all requirements credited. Let the boss kill you on this floor.'),'good');
  };
  window.addEventListener('keydown',ev=>{
   if(ev.repeat)return;
   const target=ev.target;if(target&&(target.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(target.tagName)))return;
   const key=ev.code&&ev.code.startsWith('Key')?ev.code.slice(3).toUpperCase():String(ev.key||'').toUpperCase();
   if(key.length!==1){typed='';return}
   const next=typed+key;
   if(cheatCode.startsWith(next)){
    typed=next;ev.preventDefault();ev.stopImmediatePropagation();
    if(typed===cheatCode){typed='';activate()}
   }else typed=key==='K'?'K':'';
  },true);
 }
})();
</script>


<script>
/* ===== ЧЁРНЫЙ РЫНОК · Black Market ===== */
(()=>{
 const KEY='gorn_blackmarket.v1',CHANCE=.2,OKD=['easy','normal','hard'];
 const ru=()=>window.__gornLang==='ru';
 const tr=(a,b)=>ru()?a:b;
 let rec=null,lastT=0,persistT=0,origTitle=null;const TCYC=300,TOD=window.__tod;
 const readMap=()=>{try{const d=JSON.parse(localStorage.getItem(KEY)||'{}');return d&&typeof d==='object'?d:{}}catch(e){return {}}};
 const persist=()=>{if(!rec)return;try{const m=readMap();m[String(SLOT)]={seed:rec.seed,t:TOD.t,k:rec.k,stock:rec.stock,said:rec.said};localStorage.setItem(KEY,JSON.stringify(m))}catch(e){}};
 const loadRec=cont=>{
   const m=readMap();if(!cont){delete m[String(SLOT)];try{localStorage.setItem(KEY,JSON.stringify(m))}catch(e){}}
   const r=m[String(SLOT)];
   if(r&&typeof r.seed==='number'){rec={seed:r.seed>>>0,k:r.k==null?null:r.k,stock:Array.isArray(r.stock)?r.stock:null,said:r.said==null?-1:r.said};if(typeof r.t==='number'&&isFinite(r.t)&&r.t>=0)TOD.t=r.t}
   else rec={seed:(Math.random()*4294967296)>>>0,k:null,stock:null,said:-1};
   persist();
 };
 /* номер ночи: растёт ровно в момент заката и не меняется до следующего заката */
 const nightIdx=()=>Math.floor(TOD.t/TCYC+.28);
 const isNight=()=>{const f=((TOD.t/TCYC)%1+1)%1;return f>=.72||f<.06};
 /* результат — чистая функция (seed слота, номер ночи): обновление страницы его не меняет */
 const shopOpen=()=>{const m=document.getElementById('modal');return !!m&&!m.hidden};
 const roll=k=>mulberry32((rec.seed^Math.imul(k+1,0x9E3779B1))>>>0)()<CHANCE;
let forceK=null; /* секретный код HIDAY: принудительная ночь с чёрным рынком */
const active=()=>{
  if(!rec||!isNight())return false;

    G.npcs.push({kind:'wander',art:'merchant',vr:'black',name:L('Мрачный торговец','Grim Merchant'),x:pos.x,y:pos.y,line:[L('Тссс... товар лучший, цена честная.','Psst... best wares, fair prices.'),L('Покупай. Это будет твоя последняя сделка.','Buy. It will be your last deal.'),L('Не оборачивайся.','Do not turn around.')],trade:false,dealer:true});
    G.npcs.unshift({kind:'wanderGuard',art:'mercenary',name:L('Наёмник','Mercenary'),x:pos.x+24,y:pos.y+2,line:[L('Торговец под моей защитой.','The merchant is under my protection.')]});
    genWanderStock();burst(pos.x,pos.y-6,'#6a2a8a',22,80);say(L('Из тени вышел торговец в чёрном...','A merchant in black steps out of the shadows...'),'bad');sfx('shrine');return true}},
  {id:'coward',c:[255,0,255],title:()=>L('Знамя страха','Banner of Dread'),cost:()=>L('урон ×0.3','damage ×0.3'),
   desc:()=>L('Урон ×0.3, враги имеют 60% шанс сбежать, как только увидят вас, до конца этажа (на боссов не действует).','Damage ×0.3; enemies have a 60% chance to flee as soon as they see you until the end of the floor (bosses are unaffected).'),
   run:()=>{G.mods.pmul=.3;G.mods.dread=true;for(const m of G.mons)if(m.awake&&!m.boss&&!m.dead)dreadRoll(m);burst(P.x,P.y,'#ff4af0',22,90);say(L('Враги дрожат при виде тебя, но твои удары стали слабее.','Foes tremble at your sight, but your blows are weaker.'),'');sfx('bless');return true}},
  {id:'gold2',c:[0,255,255],title:()=>L('Ледяной бег','Frozen Stride'),cost:()=>L('враги бьют чаще','foes strike faster'),
   desc:()=>L('×1.5 к скорости до конца этажа, но скорость атак врагов увеличивается в 1.5 раза.','×1.5 movement speed until the end of the floor, but enemy attack speed is increased by 1.5×.'),
   run:()=>{G.mods.pspd=1.5;G.mods.matk=1.5;burst(P.x,P.y,'#5af0ff',22,100);say(L('Ноги стали лёгкими, но враги бьют чаще.','Your legs feel light, but the enemies strike faster.'),'');sfx('bless');return true}},
  {id:'iron',c:[155,0,255],title:()=>L('Закалка','Tempering'),cost:()=>L('броня −45%','armor −45%'),
   desc:()=>L('Экипированное оружие (лук и меч) получает +25% прочности, ваша броня теряет 45% от максимальной прочности.','Equipped weapons (bow and sword) gain +25% durability; your armor loses 45% of its maximum durability.'),
   run:()=>{
    for(const k of ['melee','ranged']){const e=P.eq[k];if(!e)continue;const m=maxDur(ITEM(e));e.d=Math.min(m,Math.round((curDur(e)+m*.25)*10)/10)}
    for(const k of ['helmet','chest','legs','boots']){const e=P.eq[k];if(!e)continue;const m=maxDur(ITEM(e)),was=curDur(e);e.d=Math.max(0,Math.round((was-m*.45)*10)/10);if(e.d<=0&&was>0)say('«'+ITEM(e).name+L('» сломан!','» broke!'),'bad')}
    recalc();burst(P.x,P.y,'#9b3cff',20,90);say(L('Оружие закалено, броня истрёпана.','Weapons are tempered, armor is worn.'),'');sfx('bless');return true}}
 ];
 const OID={};OPT.forEach(o=>OID[o.id]=o);
 const avail=()=>OPT.filter(o=>DF.id==='hell'?o.id!=='god':o.id!=='godless');
 window.newAltar=function(x,y){
  const rgb=[0,1,2].map(()=>Math.floor(Math.random()*256)),av=avail();
  const ds=av.map(o=>({o,d:Math.hypot(o.c[0]-rgb[0],o.c[1]-rgb[1],o.c[2]-rgb[2])})).sort((a,b)=>a.d-b.d);
  return {x,y,kind:'rgb',used:false,bc:+(.5+Math.random()*.16).toFixed(2),rgb,opts:[ds[0].o.id,ds[1].o.id]};
 };
 /* страх: часть врагов убегает (вместо обычного ИИ работает своя логика бегства) */
 function dreadRoll(m){if(m._dread===undefined)m._dread=Math.random()<.6}
 function fleeAI(m,dt,dx,dy,dist){
  m.state='wait';m.tele=0;m.bowDrawState=null;m.hitCd=Math.max(m.hitCd||0,.5);m.cd=Math.max(m.cd||0,.5);
  if(dist>170&&!los(m.x,m.y,P.x,P.y))return; /* ушёл достаточно далеко — замирает */
  m.fa=m.fa===undefined?Math.atan2(-dy,-dx):m.fa;
  m.ft=(m.ft||0)-dt;
  const want=Math.atan2(-dy,-dx),sp=m.sp*.95,pass=m.d.pass;
  const free=a=>pass||!blockedAt(m.x+Math.cos(a)*7,m.y+Math.sin(a)*7,m.r*.8);
  if(m.ft<=0||!free(m.fa)){
   m.ft=.35;let best=null;
   for(const o of [0,.5,-.5,1,-1,1.6,-1.6,2.2,-2.2]){const a=want+o;if(free(a)){best=a;break}}
   if(best!==null)m.fa=best; else m.fa=want+Math.PI/2*(Math.random()<.5?1:-1); /* загнан в угол */
  }
  const vx=Math.cos(m.fa),vy=Math.sin(m.fa);
  moveEnt(m,vx*sp*dt,vy*sp*dt,pass);
  if(Math.abs(vx)>.1)m.face=vx>0?1:-1;
 }
 const _um1=updMon;
 updMon=function(m,dt){
  if(!G.mods||!G.mods.dread||G.mode!=='dungeon'||!m||m.boss||m.dead)return _um1.apply(this,arguments);
  if(m.awake)dreadRoll(m);
  if(!(m._dread&&m.awake&&!(m.stun>0)))return _um1.apply(this,arguments);
  m.hitCd=Math.max(m.hitCd||0,.5); /* убегающие не наносят контактный урон */
  const key=m.d.ai,orig=AI[key];AI[key]=fleeAI;
  try{return _um1.apply(this,arguments)}finally{AI[key]=orig}
 };
 /* каждый убитый страж печати приносит свою награду */
 const _km=killMon;
 killMon=function(m){_km.apply(this,arguments);if(m&&m.guard&&!m._gr){m._gr=1;dropAt(m.x,m.y,{kind:'gold',v:Math.round(10+G.depth*4)})}};
 /* мрачный торговец нападает после закрытия лавки, даже если вы что-то купили */
 const _aw=angerWanderer;
 angerWanderer=function(n){
  const before=G.mons.length,r=_aw.apply(this,arguments);
  if(n&&n.dealer){const m=G.mons.slice(before).find(x=>x.k==='wmerch');if(m){m.vr='black';m.maxHp*=2;m.hp=m.maxHp;m.dmg=45;m.raw=1}}
  return r;
 };
 const _cm=closeModal;
 closeModal=function(){
  const w=(UI.ctx==='wander'||UI.ctx==='wtrade')&&G.curW&&G.curW.dealer?G.curW:null;
  _cm.apply(this,arguments);
  if(w&&G.npcs.indexOf(w)>=0)angerWanderer(w);
 };
 /* эффекты алтарей действуют до конца этажа: при возвращении в город они снимаются */
 const _gt0=goTown;
 goTown=function(){if(G&&G.mods)G.mods={};return _gt0.apply(this,arguments)};
 /* окно алтаря */
 const hex=a=>'#'+a.map(v=>v.toString(16).padStart(2,'0')).join('').toUpperCase();
 const rgbs=a=>'rgb('+a[0]+','+a[1]+','+a[2]+')';
 const _os=openShrine;
 openShrine=function(s){
  if(s.kind!=='rgb')return _os.apply(this,arguments);
  if(s.used)return;
  UI.open=true;sfx('shrine');G.curShrine=s;
  const cards=s.opts.map((id,i)=>{const o=OID[id],oc=o.c[0]+o.c[1]+o.c[2]===0?[90,60,120]:o.c;
   return '<div class="alt-opt" style="--oc:'+rgbs(oc)+'"><div class="alt-t"><b>'+esc(o.title())+'</b><small>'+esc(o.cost(s))+'</small></div><p>'+esc(o.desc(s))+'</p><button class="btn primary" data-noic data-vact="altar:'+i+'">'+esc(L('Выбрать','Choose'))+'</button></div>'}).join('');
  showDlg('<div class="alt-head"><div><h2>'+esc(L('Алтарь','Altar'))+'</h2><p class="hint">'+esc(L('Выберите одно из двух. Алтарь откликается лишь раз.','Pick one of two. The altar answers only once.'))+'</p></div></div><div class="alt-opts">'+cards+'</div><button class="btn" data-noic data-vact="close">'+esc(L('Отойти','Step back'))+'</button>',1,'alt-win');
 };
 const _v=vAct;
 vAct=function(sv){
  const i=String(sv).indexOf(':'),k=i<0?sv:sv.slice(0,i),a=i<0?'':sv.slice(i+1);
  if(k!=='altar')return _v.apply(this,arguments);
  const s=G.curShrine;if(!s||s.used||s.kind!=='rgb')return;
  const o=OID[s.opts[+a]];if(!o)return;
  hideDlg();UI.open=false;
  if(!o.run(s))return;
  s.used=true;
  if(o.id==='blood'||o.id==='greed'||o.id==='seal'){try{S.shr[o.id]=1;S.shrN=S.shrN||{};S.shrN[o.id]=(S.shrN[o.id]||0)+1}catch(e){}}
  try{saveS()}catch(e){}
 };
})();
</script>
