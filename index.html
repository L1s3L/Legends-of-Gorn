ass=\"att\"><small>Достижение получено</small><b>","Достижения ","<header><h2>Достижения <small>","<div class=\"achnote\">На сложности «Лёгкая» достижения отключены.</div>","<em class=\"bad\">условие нарушено в этом слоте</em>","Вы прошли игру! Горн покорён.","Средний урон за секунду при постоянных атаках: урон × скорость атаки.","Поджигает цель: враг получает урон от горения несколько секунд.","Урон одной выпущенной стрелы до множителей уровня и бонусов.","Сколько атак (выстрелов) в секунду. Выше — быстрее убиваете врагов.","Дальность удара клинка. Больше — можно бить врагов с безопасного расстояния.","Как далеко летит стрела до исчезновения.","Лук не тратит стрелы из колчана.","Часть нанесённого урона возвращается вам в виде здоровья.","Сколько здоровья отнимает удар. Умножается на уровень героя и бонусы.","Снижает входящий урон: чем выше защита, тем слабее удары врагов.","Работает вместе с защитой (считается с весом ×2) и режет входящий урон.","Часть урона отражается обратно в атакующего врага.","Бонус к скорости передвижения героя.","Снижает урон при падении на следующий этаж.","Сколько секунд можно находиться в воде, не тонув.","Запас износа. Предмет изнашивается при использовании; сломанный даёт лишь половину эффекта до ремонта у кузнеца.","Суммарный вес брони выше лимита сложности замедляет героя.","Шанс нанести удвоенный урон.","Чистота материала меняет все статы предмета.","Качество ковки усиливает основной стат предмета.","Обработка материала усиливает основной стат, но влияет на прочность.","Форма определяет баланс урона, скорости и дальности.","Магический бонус на предмете. Уровень (I–V) усиливает эффект.","Недостаток предмета: снижает часть характеристик.","Украшение, дающее небольшой бонус.","Материал задаёт базовую силу предмета. Ступень — его уровень от 1 до 9.","Самая низкая редкость. Мало бонусов.","Редкость 2 из 6: немного бонусов.","Редкость 3 из 6.","Редкость 4 из 6: сильные бонусы.","Редкость 5 из 6: очень сильный предмет.","Высшая редкость, лучшее качество в игре.","Метка лутбокса: есть шанс получить предмет редкостью ниже.","Метка лутбокса: есть шанс получить предмет редкостью выше.","Восстанавливает прочность. Цена зависит от ценности предмета и износа.","Продажа предмета. Цена зависит от ценности и оставшейся прочности.","Покупка за золото. Рюкзак должен иметь свободное место.","Лутбокс: при открытии даёт случайный предмет. Диапазон редкости и метки указаны в описании.","Перековка меняет предмет на новый того же типа за золото.","Вместимость ограничена. Расширение продаёт торговец.","Хранилище вещей между вылазками.","Надетые предметы: меч, лук и 4 части брони.","Золото тратится у торговцев, кузнеца и строителя.","Одинаковые части брони дают бонус комплекта.","Лутбокс из магазина: случайный предмет из указанного диапазона.","Лутбокс: откройте, чтобы получить случайный предмет. Клик — подробности.",". Клик — подробности, двойной клик в рюкзаке — надеть. «!» значит предмет изношен.","Слот ","Разъярённый торговец","«Пришёл и не обменялся?! Ты за это заплатишь!»","«Смотреть и не покупать?! Ты за это заплатишь!»","Торговец повержен. Из его мешка что-то выпало.","АУУУ!","Взрыв ","монстра","Приблизительный показатель для сравнения оружия, основанный на уроне и скорости; для мечей также учитывается шанс крита. Реальный урон за секунду зависит от боя, бонусов и других условий.","Сколько здоровья отнимает одна стрела при попадании. Крит удваивает урон. Дальность и точность лука определяют, сколько стрел реально достигнет цели.","Урон удара","Базовый урон одного удара клинка. Он растёт с материалом, ковкой, чистотой и зачарованием «Острота».","Сколько ударов в секунду способен нанести клинок. Быстрое оружие чаще попадает, быстрее запускает вампиризм и поджог, но каждый удар слабее. Медленное бьёт редко, зато сильно — выбирайте под свой стиль.","Сколько выстрелов в секунду делает лук. Чем выше темп, тем плотнее поток стрел, но стрелы кончаются быстрее. Зачарование «Быстрая перезарядка» увеличивает этот показатель.","Дальность удара клинком. Чем она больше, тем безопаснее бить врага: вы достаёте его, пока он ещё не дотянулся до вас. Особенно важна против быстрых и колючих противников.","Дальность лука","Как далеко летит стрела, прежде чем исчезнет. Дальний лук позволяет расстреливать магов и стрелков, оставаясь вне их досягаемости. На коротких дистанциях разница почти незаметна.","Определяет разброс стрел. Высокая точность уменьшает разброс, но обычный выстрел всё равно может немного отклониться от прицела.","Шанс критического удара","Вероятность нанести удвоенный урон. Работает для каждого удара и выстрела независимо. Складывается с бонусами брони, перков и еды; высокий шанс особенно хорош при быстрых атаках.","Удар поджигает врага: несколько секунд он получает урон от горения. Некоторые существа огнеупорны и игнорируют поджог.","Часть нанесённого урона возвращается вам здоровьем. Чем выше процент и урон, тем сильнее лечение. Это постоянный способ восстанавливаться без зелий, пока вы бьёте врагов вплотную.","Лук с этим зачарованием не расходует стрелы из колчана. Можно стрелять без остановки, не заботясь о запасе — идеально для затяжных боёв и боссов.","Запас износа предмета. Когда прочность кончается, оружие наносит меньше урона и атакует медленнее, а броня хуже защищает. Некоторые другие свойства сохраняются. Починить предмет можно у кузнеца.","Вес брони","Общий вес надетой брони. До лимита веса (он зависит от сложности) движение не страдает; всё, что выше, замедляет героя пропорционально перегрузу. Лёгкие материалы позволяют носить больше защиты без потери скорости.","Снижает входящий урон от каждого удара врагов. Эффект убывает: первые очки защиты дают больше, чем последующие. Защиту суммируют все четыре части брони, комплекты и перки.","Работает вместе с защитой, но считается с двойным весом при расчёте снижения урона. Высокая стойкость особенно полезна против множества мелких ударов и снарядов.","Процент урона от огня, лавы и поджога, который вы не получаете. Предел — 80%. Необходима в Преисподней, где почти всё горит и взрывается.","При ударе врага в ближнем бою шипы наносят ему ответный урон. Его величина зависит от шипов и уровня героя, а не от доли полученного урона.","Бонус к скорости перемещения героя. Помогает уклоняться от снарядов, догонять и убегать. Вес брони выше нормы действует в обратную сторону и отнимает часть скорости.","Уменьшает урон от падения в провал на следующий этаж и от шипов-ловушек. На лёгких уровнях сложности падение вообще не наносит урона.","Сколько дополнительных секунд вы можете находиться в воде, прежде чем начнёте тонуть. Позволяет пересекать озёра и обходить врагов по воде.","Общий множитель всего вашего урона: растёт с уровнем героя и бонусами от еды, алтарей и перков. Умножает урон каждого оружия, поэтому его стоит поднимать в первую очередь.","Перегруз","Броня тяжелее нормы замедляет вас. Снимите самую тяжёлую часть или замените её лёгкой, например кожаной или мифриловой, чтобы вернуть скорость.","Суммарный вес надетых вещей. До лимита веса (он зависит от сложности) вы бегаете свободно, выше — теряете скорость. Тяжёлая броня защищает лучше, но требует баланса.","Качество самого материала — от «Загрязнённого» до «Безупречного». Чистота влияет на основные характеристики предмета, но не на все его параметры.","Мастерство, с которым предмет выкован: от «Халтуры» до «Шедевра». Усиливает основной показатель — урон или защиту — и немного влияет на цену. Перековка у кузнеца создаёт новый предмет с новым качеством.","Дополнительная обработка материала: закалка металла, пропитка дерева или огранка кристалла. Усиливает основной стат и прочность. Чем изощрённее способ, тем выше результат.","Тип оружия","Форма определяет характер оружия: у кинжала высокая скорость и малая досягаемость, у большого меча — наоборот. Лук с длинным плечом бьёт дальше, короткий стреляет чаще.","Магическое свойство предмета с уровнем от I до V. Даёт бонусы: острота, вампиризм, защита, шипы. Белые искры на предмете означают наличие зачарований. Чем выше уровень, тем мощнее эффект.","Недостаток предмета: трещина, ржавчина или перекос. Снижает часть характеристик, зато такая вещь стоит дешевле. Выбор, брать ли её, за вами.","Рейтинг","Общая оценка предмета по материалу, чистоте, ковке, зачарованиям и дефектам. Чем выше рейтинг, тем выше редкость. Но сравнивая предметы, смотрите прежде всего на главный показатель: урон или защиту.","Ценность","Базовая стоимость предмета. Торговцы продают его дороже, а покупают примерно за половину этой суммы в зависимости от прочности. Ломбард платит больше за эпические вещи и выше.","Сильная сторона","Самый выдающийся показатель предмета относительно возможного максимума для его типа. Помогает быстро понять, чем эта вещь особенно хороша.","Комплект брони","Если вы носите несколько частей брони из одного материала, открываются бонусы. Две части дают первый бонус, четыре — усиленный.","Один раз спасает от смерти и расходуется. Восстанавливает 50%, 75% или 100% здоровья в зависимости от уровня часовни. Покупается в часовне.","Ступень материала","Уровень материала от 1 до 10. Чем выше ступень, тем больше базовый урон, защита и прочность. Выпадение высоких ступеней зависит от глубины этажа.","Необычная редкость","Вторая из шести редкостей. Предметы с небольшими бонусами и разумным качеством, часто встречаются на первых этажах.","Обычная редкость","Самая низкая редкость: простые вещи почти без бонусов. Хороши в начале игры и как материал для продажи.","Редкая редкость","Третья ступень из шести: заметные бонусы, нередко зачарования. Хорошая основа снаряжения на ранних и средних этажах.","Эпическая редкость","Четвёртая ступень из шести: сильные вещи с несколькими зачарованиями. Подходят для ломбарда, где за них дают повышенную цену.","Легендарная редкость","Пятая из шести: исключительные предметы с мощными свойствами и высоким качеством. Выпадают редко, обычно с элитных врагов и боссов.","Мифическая редкость","Высшая из шести редкостей. Мифический предмет собран из лучших материалов с безупречным качеством и множеством зачарований. Встречается крайне редко.","Запечатанный ящик со случайным предметом. Метки сужают категорию, редкость, материал и зачарование. Базовая цена оценивается по выборке содержимого: примерно средняя цена плюс 10% и 40 монет, до скидок. Откройте двойным щелчком.","Метка «Удачливый»","С шансом 10% повышает выбранную редкость на одну ступень, но не выше максимальной. С артефактом удачи шанс — 20%; результат не обязательно выйдет за обычный диапазон.","Метка «Неудачливый»","Коробка с этой меткой имеет шанс выдать предмет редкостью ниже обычного диапазона. Зато стоит дешевле.","Мягкая выделанная шкура. Лёгкая и бесшумная, почти не замедляет, но защищает слабо. Комплект кожи даёт бонус к скорости.","Простая древесина: дёшево и легко. Подходит для первых вылазок, но быстро изнашивается.","Тяжёлый материал для мечей. Каменная броня в обычной добыче не создаётся.","Мягкий металл начала пути. Недорог, лёгок в ковке; комплект приносит бонус к добыче золота.","Надёжная рабочая лошадка: хорошая защита за разумный вес. Комплект железа усиливает защиту и урон.","Красивый, но слишком мягкий металл: почти не держит удар и быстро ломается, зато стоит дорого. Комплект сильно повышает добычу золота.","Закалённое железо с углеродом: острое и прочное. Комплект стали увеличивает урон и шанс крита.","Вулканическое стекло, которое легко разбить, но очень острое; хорошо переносит огонь. Комплект даёт огнестойкость и шипы.","Твёрдый кристалл с отличным уроном. Лёгкий для своей прочности. Комплект повышает шанс крита и урон.","Лёгкий серебристо-зелёный металл эльфов. Крепок как сталь, но почти не весит. Комплект повышает скорость и урон.","Чёрный металл из глубин, выдерживающий лаву. Очень прочный и тяжёлый. Комплект даёт много здоровья и огнестойкость.","Радужный минерал, ступень 10: лучше незерита по всем показателям и при этом легче. Находится только на самых нижних этажах. Комплект даёт здоровье, огнестойкость, защиту и урон.","Кость дракона, пропитанная огнём. Лучший материал для лука до турмалина: огромный урон, высокая цена.","Крепкий дуб: баланс урона и скорости для надёжного лука.","Лёгкая берёза: быстрая стрельба, но невысокий урон.","Гибкая ель: быстрый, дешёвый лук для новичков.","Классическая древесина для луков: упругая и мощная.","Кость: лёгкая и острая, хороший урон на ранних этажах.","Чёрное дерево: тяжёлый плотный лук с высоким уроном.","Древесина живых энтов: прочная, с высоким шансом зачарований.","Кристаллический лук: невесомый и очень точный, с высоким шансом зачарований.","Особое","Экономика","Ковка","Показывают стрелки рядом с предметами: зелёная ▲ — вещь лучше надетой по главному показателю, красная ▼ — хуже. Покупаются у торговца один раз.","Открывают панель справа внизу с важными характеристиками героя: здоровье, урон, защита, скорость. При изменении числа загораются зелёным или красным.","Фиолетовые линзы хранят память о каждом этаже. Пока очки при вас, на карте в углу экрана горит яркая фиолетовая метка там, где находится спуск вниз, даже если вы там ещё не были. Незаменимы, когда нужно быстро найти провал.","Расширение рюкзака","Навсегда увеличивает вместимость рюкзака на "," ячеек. Чем больше места, тем реже приходится возвращаться в деревню. Размер расширения каждый раз случайный.","Запечатанный ящик со случайным предметом. Метки сужают категорию, редкость и материал. До скидок базовая цена оценивается по выборке: примерно средняя цена плюс 10% и 40 монет. Откройте двойным щелчком в рюкзаке.",". Клик — подробности. Двойной щелчок в рюкзаке — надеть, по надетому — снять, в лавке — купить. «!» значит, что предмет изношен."," Ступень "," из 10.","зачарование","Носите несколько частей брони из одного материала — и открываются бонусы. Две части дают первый бонус, четыре — усиленный.","Улучшение","Улучшение за уровень героя. Каждый новый уровень усиливает эффект. Узнайте, какие предметы и перки хорошо работают вместе.","Сравнение","Стрелка сравнивает предмет с надетым по главному показателю: урону или защите. Зелёная ▲ — лучше, красная ▼ — хуже, «:I» — одинаково. Равные по главному сравниваются по рейтингу.","<div class=\"mg-top\"><span id=\"mg-count\"></span><button class=\"btn sm\" id=\"mg-skip\" type=\"button\">Пропустить ›</button></div><div id=\"mg-page\"><div id=\"mg-stage\" class=\"mg-stage\"></div></div><div class=\"mg-hint\">▶ Клик · Пробел</div>","c|Сотни и тысячи лет в этих землях царил покой.","s|Хочу деревню на краю света. Подальше от городов.|6|6|l","c|Указ был издан. Деревню отстроили за одно лето.","c|А потом у околицы заметили яму.","s|Глубокая... Дна не видно!|8|8|l","C|Вниз спустились трое смельчаков.","c|Никто не вернулся.","s|Больше я никого не отпущу вниз! Нужен лучший из нас.|8|8|l","c|Выбор пал на тебя — лучшего воина деревни.","s|Я их верну.|52|40|r","C|В самом низу пещер сидит свирепый страж. Тебе — к нему.","b|ТЫ НЕ УЙДЁШЬ ОТСЮДА!|30|6","c|Один удар. Один — за всех, кто не вернулся.","c|Маска стража раскололась надвое. Под ней оказалось не чудовище, а человеческое лицо.","s|Ты дошёл, {n}... Я уже не верил. Я ведь тоже был лучшим воином. Когда-то.|6|6|l","s|Так это ты спустился первым?|6|8|l","s|Меня несли на руках, как тебя. А потом бездна выбрала меня.|38|46|r","c|Яма не была бедой. Деревню поставили у неё нарочно.","w|Король знал. Король всегда знал. Он только ждал, кто дойдёт до конца.|6|56|n","s|Прости... Я не удержал Сердце. Теперь оно твоё. Береги тех, кто наверху.|8|8|l","c|В центре зала, как раненый зверь, пульсировало Сердце Бездны. С каждым ударом всё слабее.","c|Из темноты выходили пропавшие: исхудавшие, едва стоящие на ногах, но живые.","s|Мы слышали бой три дня. Мы молились, чтобы это был ты.|8|54|l","c|Сердце погасло. Впервые за века бездна замолчала, и кто-то в тишине заплакал от счастья.","Золотой провожатый","Торговцы спустились за тобой и вывели всех к свету.","c|Золото героя звенело в каждой лавке деревни. Торговцы помнили, чьи это монеты, и чьими руками они были заработаны.","s|Ты кормил нас весь год, {n}. А мы привыкли отдавать долги.|40|8|r","s|Свет! Это же свет!|6|8|l","s|Нас вывели торговцы! Торговцы, представляешь?!|50|44|r","s|Быстрее наверх, пока своды держатся! Дорогу оплачу я.|8|8|l","C|К деревне вышли на рассвете. Впервые за долгие месяцы кто-то из спасённых смеялся вслух.","c|На площади открыли ярмарку в честь героя. Торговцы впервые торговали в убыток и были счастливы.","s|Ни монеты с тебя, {n}. Ни единой.|8|56|l","Цена героя","Торговцы пришли за золотом и не стали оставлять свидетелей.","c|Золото героя звенело на всю округу. Торговцы услышали этот звон и спустились в бездну сами. Не ради спасения.","s|Вы пришли помочь?..|6|8|l","s|Ты ничего не купил у нас, {n}. Всё золото осталось при тебе.|38|44|r","c|Бездна слышала только звон монет. И то, как он оборвался.","c|В глубине нет свидетелей. Только эхо, а оно быстро забывает.","c|Торговцы вернулись на рассвете. Кошельки у них были тяжелее, чем при отходе.","s|А где {n}? Он ведь пошёл за нами...|8|8|l","s|Не вернулся. Бездна, она такая... Бывает.|40|46|r","Крепость Горна","Монстры вышли из ямы, но деревня была к этому готова.","c|Ты шёл вниз мимо тварей, не оглядываясь. Они копились и копились, пока яма не стала им тесна.","s|Они лезут из ямы! Все к стенам!|8|8|l","s|Стены выдержат! Мы строили их именно для этого!|50|44|r","b|НИ ШАГУ НАЗАД!|30|10","c|Ты вернулся в самый разгар боя. Раненый, грязный, но не опоздавший.","b|ЗА ДЕРЕВНЮ!|20|8","c|К утру яму завалили камнями. Стены стояли целы, и каждый кирпич в них был твоим.","s|Мы думали, ты строишь нам дома. А ты строил нам щит.|6|56|l","Тьма из ямы","Монстры пришли за тем, кого обходил герой. Деревня не устояла.","c|Ты проходил мимо тварей, будто их нет. Они не забыли ни одного шага.","s|Из ямы лезут! Бегите! В лес, дети, в лес!|8|8|l","c|Крики стихли только к рассвету.","s|Я опоздал... Я снова опоздал.|8|8|l","c|Дома стояли пустые. Ни частокола, ни погребов: деревня не успела стать крепостью.","C|Бездна получила всё, что копила в себе годами.","Старший охотник","Ты вычистил бездну и стал главой охотников.","c|Этаж за этажом ты выжигал бездну дочиста. Ни одного логова, ни одного рыка в темноте.","s|Тихо... Теперь по-настоящему тихо.|8|8|l","s|Все контракты избы закрыты, {n}! Все до единого, впервые за сто лет!|6|8|l","s|Изба давно ждёт своего старшего. Она ждёт тебя, {n}.|50|8|r","c|Охотники встали разом и подняли кружки. Никто не говорил: все и так знали, что сказать.","C|На месте ямы шумит молодой сад. Первое дерево в нём посадил ты.","Пустая бездна","Бездна осталась без добычи и забрала последнего, кто был внизу.","c|Этаж за этажом ты вычищал бездну дочиста. Хищникам внизу больше нечего было есть.","w|Тишина. Слишком тихо. Так тихо не бывает...|8|8|l","w|Ты забрал всю мою добычу... Тогда добычей станешь ты.|10|40|n","c|Бездна, лишённая добычи, потянулась к последнему живому, что осталось внизу.","c|{n} остался в пещерах навсегда. Последний охотник среди пустых нор.","C|Яма закрылась сама, без звука. Больше её никто не видел.","Ни одной смерти и почти ни одного зелья.","c|Ты ни разу не пал. В деревне решили, что это сказка для детей.","s|Целый. Все кости на месте. Даже не верится.|8|8|l","s|{n}! Живой! Без единой царапины!|8|8|l","s|Матери, не плачьте! Это не призрак!|50|44|r","c|Тебя несли на руках до самой площади. Ты просил отпустить, они только крепче держали.","s|Король шлёт тебе поклон, {n}. Такие, как ты, рождаются раз в сто лет.|6|8|l","C|О безупречном герое поют до сих пор. Каждый, правда, свою песню.","Склянки на поясе","Ни одной смерти, зато пояс звенел пустыми склянками.","c|Ты ни разу не пал. Но не потому, что не получал ударов: ты просто умел вовремя сделать глоток.","s|Ещё один глоток... Последний. Обещаю.|8|8|l","s|Сколько же ты выпил, {n}?! Пояс звенит, как колокольчик!|8|8|l","s|Зато ты жив. А это дороже любого пояса.|40|8|r","c|Склянки собрали в мешок. Мешок вышел тяжелее меча и куда звонче.","C|Их повесили над входом в таверну как трофей. Как доказательство, что осторожность тоже подвиг.","Воскресший","Свет возвращал тебя снова и снова. Тебя нарекли святым.","c|Ты падал так часто, что деревня сбилась со счёта. И каждый раз вставал.","s|Свет не отпускает тебя, дитя. Он отправляет тебя обратно.|36|8|r","b|Я ВСТАНУ!|30|8","c|Страж пал. На этот раз не ты.","s|Это он! Тот, кого мы хоронили! Он вернулся к нам!|8|8|l","C|На месте ямы выросла часовня. Над дверью выбито твоё имя дрожащими руками тех, кого ты вернул домой.","Вернувшийся снова","Бездна слишком часто отпускала тебя. Деревня испугалась.","c|Ты умирал снова и снова. Бездна не желала тебя отпускать, а потом перестала отпускать вовсе.","w|Опять я здесь? Сколько раз уже?..|8|8|l","c|Страж пал. Но смерть больше не слушалась тебя так, как слушалась всех.","s|Не пускайте его! Он не стареет!|6|8|l","s|Я видел, как он умирал. Дважды!|40|46|r","c|Двери деревни закрылись перед тем, кто слишком часто возвращался. Никто даже не окликнул.","C|Герой ушёл обратно к яме. Больше его не видели. Говорят, там он наконец уснул.","Тень со стрелой","Ты бил издалека и ни разу не подпустил босса.","c|Ты бил издалека. Ни один зверь не успел дотянуться до тебя, ни один не успел даже вдохнуть.","b|ЩЁЛК!|8|6","w|Я даже не...|40|50|n","c|Страж рухнул, так и не поняв, откуда пришла смерть.","C|Ты вышел из бездны налегке и без единой царапины.","s|А где же раны? Ты вообще там был?|8|8|l","c|Охотники прозвали тебя Тенью. Стрелы с твоим клеймом ценятся дороже золота: их не покупают, а завещают.","Последняя стрела","Лук сделал своё дело, но слишком дорогой ценой.","c|Лук дрожал в руках. Страж был так близко, что слышалось его дыхание. А в колчане осталась одна стрела.","b|ПОСЛЕДНЯЯ!|20|8","w|Только не промахнись...|8|58|n","c|Стрела вошла точно в прорезь маски. Лук хрустнул в твоих пальцах, будто тоже выдохнул.","C|Ты вышел, хромая, без стрел и без оружия. Но с живой деревней за спиной.","s|Где твой колчан, {n}?|6|8|l","s|Весь он был в одной стреле.|40|46|r","c|Над входом в деревню воткнули стрелу, копию той последней. Чтобы помнили, чего стоит один верный выстрел.","Клинок героя","Кузнец перековал твой меч так, что он пережил бездну.","c|Ты ковал меч вместе с кузнецом, раз за разом, год за годом. Вы стали больше, чем герой и мастер.","s|Ещё раз, {n}. Огонь не терпит жалости.|8|56|l","b|ЗА ГРОМА!|8|6","c|Клинок прошёл сквозь маску стража так, словно её и не было.","s|Ни зазубрины... Мой лучший меч. И мой лучший ученик.|8|8|l","c|Меч поставили в центре деревни. Дети приходят смотреть, старики помнить о надежде.","C|Кузнец выбивает на каждом новом клинке имя {n}. «Чтобы знали, с кого берём меру», говорит Гром.","Затупившийся клинок","Меч не пережил бездну. Ты вышел с пустыми руками.","c|Ты бил мечом всю дорогу и лишь изредка заглядывал к кузнецу. Клинок кричал трещинами, а ты не слышал.","b|ХРУСТ!|20|6","c|Клинок сломался о маску стража. Половина осталась в твоей руке, половина в его груди.","C|Ты вышел с одной рукоятью в кулаке. Это всё, что осталось от меча.","s|Заходил бы почаще, я бы услышал трещину. Я бы его спас.|8|8|l","c|Обломок повесили над кузницей. Не в упрёк, а в память: чтобы каждый, кто идёт вниз, сперва заходил к мастеру.","Возвращение домой","Ты вывел всех в отстроенную деревню.","c|Ты вывел людей из бездны по одному: на плечах, на руках, по тёмным ходам, которые теперь знал наизусть.","C|Дорога наверх была долгой. Никто не говорил. Все смотрели на небо, о котором успели забыть.","s|Мы дома, {n}. Мы правда дома.|8|8|l","s|Теперь у нас есть лавки, таверна и ты. Чего ещё желать?|6|8|l","c|Яму закрыли на засов. Ключ отдали герою: не как власть, а как доверие.","c|Деревня зажила. Если бездна снова позовёт, герой знает дорогу. Но пока только тихие вечера.","Тихое возвращение","Ты вывел людей и скромно ушёл домой.","c|Ты вывел людей из бездны и ничего не попросил взамен. Ни золота, ни слов благодарности.","C|На рассвете вы вышли к деревне. Кто-то заплакал, не стесняясь.","s|Благодарим тебя, {n}. Благодарим...|8|8|l","c|Ночью ты ушёл, пока все спали. Дело сделано, а благодарность тяжелее меча.","C|Яма осталась открытой. Но теперь из неё не слышно криков.","c|Говорят, на площади той деревни стоит памятник без надписи. Старики знают, чей он, и молчат. Как тот, кому он поставлен.","Последняя перековка","Кузнец устал от твоих бесконечных перековок. Окончательно.","c|Ты перековывал снаряжение пятьдесят раз. Потом ещё и ещё. Кузнец Гром считал каждую.","s|Опять?! Да сколько можно?! Я не железо, {n}!|8|8|l","c|У всякого терпения есть дно. У кузнецов оно особенно близко.","s|Кажется, я перегнул...|6|8|l","s|Я чтил твой клинок как сына! А ты: «ещё разок, ещё разок»!|40|46|r","c|Кузнец подбросил молот. Тот описал в воздухе красивую, неспешную дугу.","c|Бездну ты победил. Кузнеца нет.","w|Теперь на двери кузницы табличка: «Перековка не более 120 раз».|6|58|n","Хорошая концовка","Плохая концовка","Секретная концовка","Открыто концовок: "," из ","Концовка ещё не открыта","<h2>Концовки ","</div><button class=\"btn\" data-fc=\"title\">Назад</button>","Богатство копишь — только покупай,/не обходи ни лавку, ни сарай.","Богатство копишь — лавки не любя:/не покупал, а прятал для себя.","Ни разу не упал, не пил почти —/лишь честный бой и чистые пути.","Не падал ты, но пил и пил —/и счёт флаконам позабыл.","Ты падал вновь и вновь — и каждый раз/в часовню шёл, молясь в урочный час.","Ты падал вновь и вновь, а свет не звал —/в часовню путь никто не показал.","Мимо зверей, не поднимаясь, дюжину раз в глубину,/но строил дом, как будто на войну.","Мимо зверей, не поднимаясь, дюжину раз в глубину,/а дом в деревне строить ни к чему.","Этаж за этажом ты вычищал до дна,/контракты брал — и принял их сполна.","Этаж за этажом ты вычищал дотла,/а в избу охотников дорога не легла.","Из лука бей, удар не принимай —/владыке бездны ран не отдавай.","Из лука бей, да страж тебя достал —/удар ты принял, хоть вдали стоял.","Меч в руках, а в кузне ты бывал —/и не раз клинок перековал.","Меч в руках, но в кузне бывал едва —/и сталь перековал не раз-два.","Кузнец терпел, счи , вот и вы!","Звери не вернутся, {n}.","Охотница Ирма","Ваши охотничьи байки — лучшие.","Учите нас, старший {n}.","Эхо бездны","Там, внизу, тихо... слишком тихо.","Королевский гонец","Король шлёт поклон, {n}.","О безупречном герое поют по всей стране.","Весёлый пьяница","За склянки героя!","Сколько же ты выпил, {n}?","Мы пришли поклониться святому {n}.","Свет вернул вас к нам.","Паломница","Говорят, он не умирает насовсем.","Благослови нас, {n}.","Стражник Хаген","Проходи быстро, {n}. Не задерживайся.","Люди боятся тех, кто возвращается снова и снова.","Ученик-лучник","Хочу стрелять, как {n}!","Тень со стрелой — вот кто вы.","Старый лучник","Стрела над входом — ваша, {n}.","Дорогая цена за дорогой выстрел.","Музыкант","Играю в честь возвращения!","Танцуйте, {n}!","Дела идут в гору, {n}!","Яма затихла — и цены тоже.","Для спасителя лучшие товары.","Горн горит ярче, {n}.","Сталь помнит тех, кто дошёл до дна.","Теперь можно строить без страха, {n}.","Скажи, что построить дальше.","Первая кружка — за {n}!","Рассказывай, как там внизу было.","Свет с тобой, {n}.","Бездна молчит. Это хороший знак.","Всё цело, {n}. Замки не трогали.","Что убрать на хранение?","Охотники рассказывают о тебе, {n}.","Работа всё ещё найдётся.","Для {n} — лучшая цена.","Редкое — по-прежнему ко мне.","Дела идут... тревожно.","Не спрашивай, {n}. Просто покупай.","Работы много. Радости мало.","Куём молча, {n}.","Строить будем. Хоть что-то.","Глядите, {n}, что осталось.","Здесь теперь тише, чем раньше.","Налью, {n}. Но без песен.","Мы просто молимся.","Бездна ещё слышна, {n}.","Замки целы. Остальное — как придётся.","Склад держу, {n}.","Охота стала мрачной.","Будь осторожен, {n}.","Времена тяжёлые. Цены тоже.","Золото любит тишину.","Слышишь? Бездна шепчет.","{n}... ты точно вернулся?","Железо стало холодным, {n}.","Что-то ходит под деревней.","Строй, пока она молчит.","Странно, {n}. Даже ветра нет.","Тихо... как в могиле, {n}.","Налить?","Свет дрожит, {n}.","Молитесь тише.","Тихо, {n}. Слишком тихо.","Добычи нет. Совсем нет.","Звери ушли, {n}.","Редкое? Здесь всё редкое.","Тише, {n}. Бездна слушает.","Борк не вернулся. Торговцы нас обходят.","Прилавок пуст, {n}. Но товары остались.","Торговый ряд зарастает бурьяном.","Торговцы теперь с тобой на «ты», {n}.","Ярмарка не закрывается!","Частокол держится, {n}!","Мы отстраиваем всё заново, {n}.","Пепел прибран, но не забыт.","Не подходи слишком близко, {n}.","Покупай и уходи.","Мы не любим тех, кто возвращается снова и снова.","Свет не хочет вас, {n}.","Охотники обходят вас стороной.","Святой {n}! Благословите нас!","В вашу честь построили алтарь.","Старший {n}, контракты ждут.","Охотники ждут приказов.","Я бы подправил... но от клинка остался обломок.","В следующий раз заходи, {n}.","Твой клинок в центре деревни, {n}.","Дети пытаются его поднять.","Лучники учатся у вас, {n}.","Безупречный {n}! Кружка за счёт заведения.","Поговорить с летописцем","С возвращением, {n}.","Брошенный прилавок","Здесь больше никто не торгует.","Товары остались. Хозяина нет.","Летописец","Хочешь, расскажу, что было дальше?","Всё записано, {n}.","c|Через месяц у деревни открылась ярмарка, что не закрывается до сих пор. Торговцев, вернувших людей, не отпустили.","c|Спасённые вернулись к огородам, к ссорам с соседями, к жизни: шумной и прекрасной.","s|Первая кружка за счёт заведения, {n}. И вторая. И... ну, вы поняли.|8|8|l","c|Золото {n} унесли в ночь. Вместе с торговцами: навсегда.","s|Лавка Борка пуста. Кто теперь продаст нам соль? Кто вернёт нам {n}?|8|8|l","c|Брошенный прилавок так и стоит на площади. Товары на нём не тронуты: их никто не смеет взять.","w|Платить некому.|8|56|n","c|Яму завалили камнями, обнесли частоколом, поставили часовых. Эта деревня больше не спит спокойно, а потому спит живой.","s|Дежурим по двое. Больше нас врасплох не застанут, {n}. Слово кузнеца.|8|8|l","c|{n} ещё долго стоял на стене и смотрел на яму. Та молчала. Это тревожило сильнее рёва.","c|Пепелище. Уцелевшие по одному вернулись из леса к тому, что осталось от домов.","s|Будем строить заново. Хоть печь да уцелела...|8|8|l","c|Деревню отстроят. Но имя {n} здесь произносят шёпотом: так зовут того, кто прошёл мимо беды.","c|Каждую осень охотники собираются в избе под началом {n}. Говорят, там самый крепкий мёд и самые честные истории.","s|Бездна пуста. Но дело охотника не кончается: оно просто выходит наружу.|8|8|l","c|На месте ямы растёт сад. Яблони, говорят, дали плоды уже в первый год.","c|Яма затихла. Но по ночам из неё слышен чей-то размеренный шаг: вверх, вниз, вверх, вниз.","c|Люди обходят яму стороной. Матери не пускают детей даже к частоколу.","s|Не подходи к краю. Она ждёт. Она всегда ждёт своего.|8|8|l","c|Каждой весной у входа в деревню вешают венок в честь {n}. Дети учат наизусть, как он ни разу не упал.","c|Безупречный герой стал легендой. Слишком гладкой, чтобы быть правдой, и потому в неё верят.","s|Я просто шёл и делал своё дело. Остальное слухи.|8|8|l","c|В таверне склянки героя висят над стойкой: стеклянный венок из подвигов, которых никто не видел.","s|Сколько же {n} выпил! И всё равно жив. Вот что значит вовремя.|8|8|l","c|Пояс стал легче. Меч тяжелее. И то и другое к лучшему.","c|К часовне {n} идут паломники со всех земель: с больными детьми, с похоронками, с последней надеждой.","s|Говорят, он не умирает насовсем. Говорят, смерть просто не успевает за ним.|8|8|l","c|Святой {n} только улыбается и возвращается к работе: «Какой из меня святой. Я просто упрямый».","c|Ставни закрыты. Дети не выходят к яме. Даже собаки лают в другую сторону.","s|Он снова вернулся. Как всегда. Как будто и не уходил.|8|8|l","c|{n} обходят стороной. Лишь дверь кузнеца приоткрыта, на всякий случай: вдруг вернётся.","c|Ученики стреляют по мишеням и кричат: «Как {n}!» Промахиваются, смеются и стреляют снова.","c|Стрела с клеймом Тени ценится дороже золота. Её не продают, её завещают.","s|Не оборачивайся, и всё получится. Остальное тетива.|8|8|l","c|Над входом в деревню торчит последняя стрела. Ржавая, кривая, самая дорогая в мире.","s|Каждый, кто проходит под ней, касается её рукой. На счастье и на память о цене.|8|8|l","c|{n} прихрамывает, но улыбается. Эта улыбка стоит всех стрел на свете.","c|Меч {n} лежит в центре деревни. Дети кладут рядом полевые цветы.","s|Я смогу его поднять! Ты?! Ха-ха!|8|8|l","c|Кузнец до сих пор не нашёл на клинке ни одной зазубрины и не перестаёт искать.","c|Обломок клинка висит над кузницей, и каждый кузнец, проходя мимо, снимает перед ним шапку.","s|Я бы подправил... но поздно. Всегда поздно, когда не спросили.|8|8|l","c|{n} обещал в следующий раз зайти к кузнецу раньше. Говорят, теперь заходит каждую неделю.","c|Дома горят огнями. На площади празднуют возвращение, и никто не хочет ложиться спать.","s|У нас теперь лавки, таверна и вы. Деревня, {n}, это когда есть куда вернуться.|8|8|l","c|Яму закрыли на засов. Ключ у {n}. Он носит его на шее и никому не показывает.","c|У дороги стоит простой камень. Ни надписей, ни цветов, только мох.","s|Кто его поставил? Никто. Он просто есть. Наверное, так надо.|8|8|l","c|На камне одно имя: {n}. Его высекли ночью, чтобы тот не узнал.","c|Над дверью кузницы висит табличка: «Перековка не более 120 раз». Ниже мелом дописано: «Для {n} тоже».","s|Говорят, молот Грома так и не нашли. Кто говорит, тот улыбается.|8|8|l","c|{n} с тех пор кует сам. И каждый удар по наковальне звучит как извинение.","Закрыто","ПКМ: ","Отброшен!","<div class=\"si tm\" title=\"Время на слоте: дни:часы:минуты:секунды\">","Защита от дальних атак","Снижает урон от стрел скелетов, магических шаров и других снарядов, летящих издалека. Складывается со всех надетых частей брони, но не больше 30%. Удары в ближнем бою и ловушки этим показателем не ослабляются.","Как быстро стрела летит к цели. Быстрые стрелы реже промахиваются по движущимся врагам и достают далёкие цели раньше. Зависит от типа лука, древесины, тетивы и зачарования «Стремительность».","Владыка стужи разгоняется!","Лазерный луч","Наставник Орвар","Тренировочный манекен","<div class=\"trn-a\"><button class=\"btn primary trn-next\" type=\"button\" hidden>Далее ▸</button></div></div></div>","<button id=\"trskip\" type=\"button\" hidden>Пропустить обучение</button>","Пропустить обучение","Точно пропустить? Нажмите ещё раз","Шаг ","Далее ▸","Пройдено: "," из 4","Сюда","Ходьба","Здравствуй, <b>","</b>! Прежде чем отправить тебя в такое опасное место, давай проверим твои навыки. Это займёт всего пару минут.","Начнём с ходьбы. Нажимай "," (или стрелки). Мышь — это прицел: герой смотрит туда, куда указывает курсор.<br>Дойди до светящегося круга, потом вернись к первой точке. Так нужно пройти <b>туда и обратно два раза</b>.","Пройдено: 0 из 4","Удар мечом","Молодец! Появился тренировочный манекен. В бою всё делается мышью: <b>клик левой кнопкой</b> — удар мечом. Если <b>удерживать</b> кнопку, герой копит силу (до 1,5 с) и бьёт тяжёлым ударом — дальше и сильнее.<br>Подойди к манекену вплотную и ударь его <b>5 раз</b>.","Ударов: 0 из 5","Ударов: "," из 5","Особый приём","Хорошо! У меча есть особый приём «","». Он включается <b>правой кнопкой мыши</b>, а после каждого использования ему нужно перезарядиться — около <b>"," секунд</b>.<br>Встань рядом с манекеном, наведи на него курсор и нажми ","Приём не задел манекен. Подойди вплотную, наведи на него курсор и нажми "," снова, когда перезарядка закончится.","Смотри на подсвеченный значок: <b>число рядом с ним — это перезарядка</b> приёма. Оно показывает, сколько секунд осталось ждать. Когда там снова написано «ПКМ» — приём готов к использованию.","Уворот","Теперь самое важное — <b>увороты</b>. Видишь таймер над манекеном? Когда он дойдёт до нуля, манекен резко прыгнет вперёд и ударит. Пока таймер стоит на месте.","Запомни: в этой игре увороты — это <b>движение</b>. Кнопки «увернуться» нет. Нужно уйти с линии удара: <b>шагни в сторону</b> или отбеги. Далеко отходить нельзя — только в пределах жёлтого круга.","Попробовать!","Следи за таймером. Как только появится красная линия — <b>сразу шагни в сторону</b>!","Не успел? Ничего страшного — силы восстановлены. Попробуй ещё раз: когда появится красная линия, <b>шагни в сторону</b>.","Силы восстановлены","Отлично, ты увернулся! Так и нужно: смотри на врага и вовремя уходи с его пути.","Теперь познакомимся с луком. Переключаться между мечом и луком можно клавишей "," или цифрами "," (меч) и "," (лук).<br>Достань лук.","Лук стреляет туда, куда направлен курсор. <b>Нажми левую кнопку мыши</b> (или зажми её) — герой выстрелит.<br>Выстрели <b>в сторону манекена</b>.","Целься в манекен: наведи на него курсор (жёлтая стрелка ▼ над ним) и нажми левую кнопку мыши.","Промах! Видишь? У лука есть <b>точность</b>: стрела не всегда летит идеально ровно. Это нормально. <b>Попробуй ещё раз</b> — прицелься в манекен.","Попал! Обычный выстрел тратит <b>одну стрелу</b>, если у лука нет бесконечных стрел. Запас показан внизу слева. Стрелы можно найти в подземелье или купить у торговца.","Приём лука","У лука тоже есть особый приём — «","». Он тоже на <b>правой кнопке мыши</b> и тратит несколько стрел ("," шт.).<br>Держи лук в руках, наведи курсор на манекен и нажми ","Приём перезаряжается: ","Здорово! Ты освоил и меч, и лук. Теперь разберёмся со снаряжением.","Рюкзак","Нажми клавишу "," — откроется рюкзак. Я положил туда <b>железный меч</b>, чтобы тебе было что рассмотреть.","Вверху — то, что <b>надето на тебе</b>: меч, лук, шлем, нагрудник, поножи и ботинки. Сейчас у тебя только простые деревянные меч и лук.","Здесь твои <b>общие характеристики</b>. Самая важная — <b>Защита</b>: чем она больше, тем меньше урона ты получаешь. Защиту дают шлем, нагрудник, поножи и ботинки.","Это <b>рюкзак</b>: сюда попадает вся добыча. Нажми на любой предмет — справа появятся его подробности. Я уже выбрал для тебя железный меч.","Предметы","Это <b>главное число</b> предмета. У оружия оно называется «<b>Урон в секунду</b>», у брони — «<b>Защита</b>». Чем число больше, тем предмет сильнее.","<br>У железного меча — <b>","</b>, у твоего деревянного — <b>","Ниже — характеристики. <b>▲</b> означает, что значение нового предмета выше, а <b>▼</b> — ниже. Зелёный цвет показывает полезное изменение, красный — вредное. Например, меньший вес отмечается зелёной стрелкой ▼.","<b>Прочность</b>. Сломанное оружие наносит меньше урона и бьёт медленнее, а сломанная броня хуже защищает; некоторые другие свойства сохраняются. Кузнец в деревне может починить вещи.","Предметы в игре выпадают <b>случайно</b>. Чтобы понять, нужен ли тебе предмет, смотри на главное число. Если оно <b>больше</b> — смело надевай (двойной щелчок по предмету). Если <b>меньше</b> — предмет чаще всего можно продать или выбросить.<br>Но есть одно исключение. Сейчас покажу.","Нажми на надпись <b>«Как сложился предмет»</b>, чтобы развернуть подробности.","Вот <b>материал</b> предмета — у нас это Железо. Материал — главное, что определяет силу вещи.<br>Если у найденного предмета материал <b>лучше</b>, чем у твоего лучшего оружия, но главное число пока ниже — не спеши его выбрасывать: <b>перекуй</b> его у кузнеца. Материал останется, а остальные свойства выпадут заново — и могут получиться лучше.","Остальные числа не так важны. А если захочешь узнать про любую характеристику больше — <b>наведи на неё курсор и подожди секунду</b>: появится подсказка.","Хорошо. Теперь закрой рюкзак: нажми "," ещё раз (или ","Зелья","Мы снова на поле боя. Будь осторожен: сейчас манекен ударит тебя по-настоящему!","Ой! Тебе нанесли <b>40 урона</b>, здоровья осталось мало. В таком случае выпей <b>зелье лечения</b>: нажми на <b>колёсико мыши</b> (средняя кнопка) или клавишу ","Зелий у тебя: ","Здорово, здоровье восстановлено! Но запомни: зелья выпадают <b>редко</b>, поэтому не трать их на всё подряд — пей, только когда здоровья правда мало. И <b>больше пяти зелий</b> с собой взять нельзя.","Зелий осталось: ","Ещё кое-что важное","Слева сверху — твоё <b>здоровье</b> (красная полоса) и <b>опыт</b> (синяя полоса). Когда опыт заполнится, у тебя поднимется уровень: здоровье вырастет, а ты выберешь одно усиление.","Справа сверху — <b>золото</b>. Его дают монстры и сундуки. За золото покупают снаряжение, зелья и стрелы, чинят и перековывают вещи, строят здания.","Внизу слева — твоё <b>оружие</b> (меч и лук), число <b>зелий</b>, число <b>стрел</b> и значок <b>особого приёма</b>.","<b>Деревня.</b> Сразу после обучения ты окажешься в деревне. Торговец Борк покупает и продаёт вещи, кузнец Гром чинит и перековывает, а строитель Маркус строит новые здания. Чтобы поговорить с жителем, подойди к нему и нажми ","<b>Подземелье.</b> Портал на севере деревни ведёт вниз, в подземелье. Там много этажей. На каждом — монстры, сундуки (открываются клавишей ",") и путь на следующий этаж. Чем глубже, тем опаснее и тем лучше добыча.","<b>Если погибнешь</b>, ты вернёшься в деревню и потеряешь часть золота, но всё снаряжение останется у тебя. Так что не бойся пробовать!","<b>Полезные кнопки.</b> "," — пауза и громкость звука. Вверху экрана есть кнопка «Достижения».","К настройке интерфейса","Мелко","Обычно","Крупно","Очень","Огромно","Максимум","<h2>Размер интерфейса</h2>","<div class=\"upn-row\"><button class=\"btn\" type=\"button\" id=\"upm\" aria-label=\"Меньше\">−</button><input id=\"upr\" type=\"range\" min=\"0.3\" max=\"2.5\" step=\"0.05\" aria-label=\"Размер интерфейса\"><button class=\"btn\" type=\"button\" id=\"upp\" aria-label=\"Больше\">+</button></div>","<div class=\"upn-act\"><button class=\"btn primary\" type=\"button\" id=\"upok\">Готово</button><button class=\"btn\" type=\"button\" id=\"upcn\">Отмена</button><button class=\"btn\" type=\"button\" id=\"uprs\">Сброс</button></div>","<span>Размер интерфейса: <b>×","</b>. Подходит?</span><button class=\"btn primary\" type=\"button\" data-a=\"ok\">Подходит ✓</button><button class=\"btn\" type=\"button\" data-a=\"again\">Изменить</button>","[обучение]","Вот и всё, <b>","</b>! Теперь ты в деревне, и дальше — сам. Желаю тебе удачи: разобраться в этой игре тебе по силам. Не бойся пробовать, ошибаться и возвращаться — так учатся все герои.","В путь!","Удачи!","Тренировочная площадка","Размер интерфейса","<span class=\"pvt\">Этаж 3 · Пещеры</span>","Полоса","Привычная полоса с точным числом внутри. Подойдёт, если удобно видеть здоровье в цифрах.","Деления","Десять блоков вместо сплошной полосы. Подойдёт, если проще прикинуть остаток по количеству блоков.","Шар","Круглый шар внизу рядом с оружием. Подойдёт, если в бою взгляд чаще бывает у нижнего края.","Под героем","Тонкая полоска прямо под ногами героя, без числа. Подойдёт, если хочется следить за здоровьем, не отводя взгляд от героя: она не закрывает заряд удара над головой.","Опыт и уровень","Тонкая полоса","Узкая синяя полоса и уровень под здоровьем. Подойдёт, если хочется, чтобы всё про героя было в одном углу.","<span class=\"pvt\">Ур. 5</span>","Кольцо","Уровень цифрой, а прогресс опыта — кольцом вокруг неё. Подойдёт, если нужен компактный значок вместо полосы.","Полоса снизу","Тонкая полоса на всю ширину у нижнего края. Подойдёт, если хочется освободить углы экрана.","Ур. 5 · 60%","Только цифры","Уровень и проценты опыта текстом, без полосы. Подойдёт, если нужен минимум деталей на экране.","<span class=\"pvt\">Ур. 5 · опыт 60%</span>","Справа сверху","Привычное место. Подойдёт, если золото удобно держать отдельно от остальных значков.","Рядом со здоровьем","Золото под полосами слева. Подойдёт, если удобно собрать все числа в одном углу.","Рядом с запасами","Золото внизу в одном ряду с оружием и зельями. Подойдёт, если золото нужно видеть, когда считаешь запасы.","Этаж и время суток","Название этажа над картой. Подойдёт, если нужно всегда видеть, где ты.","Слева сверху","Подпись под полосами слева. Подойдёт, если правый верхний угол хочется оставить свободным.","При входе","Название появляется на несколько секунд при входе на этаж и исчезает. Подойдёт, если нужен чистый экран.","<span class=\"pvt\" style=\"padding:1px 5px;border:1px solid #e5b04a;background:rgba(10,12,16,.8)\">Этаж 3 · Пещеры</span>","Миникарта","Карта в правом верхнем углу в полный размер. Подойдёт, если часто сверяешься с картой.","Малая","Уменьшенная и полупрозрачная. Подойдёт, если карта нужна изредка, а обзор важнее.","Карта под полосами слева. Подойдёт, если правый верхний угол хочется освободить.","Слева снизу","Два слота в левом нижнем углу. Подойдёт, если нравится привычный порядок.","По центру снизу","Слоты внизу по центру. Подойдёт, если смену оружия проще заметить ближе к центру экрана.","Столбик слева","Слоты друг под другом у левого края. Подойдёт, если нижний край хочется оставить свободным.","Только текущее","Виден только слот того оружия, что сейчас в руках. Подойдёт, если нужно меньше значков.","Зелья и стрелы","Рядом с оружием","Небольшие значки с числами в одном ряду с оружием. Подойдёт, если нужны лишь числа.","Слоты с клавишей","Крупные слоты, на значке зелья написана клавиша. Подойдёт, если ещё запоминаешь управление или любишь крупные значки.","<u>Лук</u></i></div>","Справа по краю","Значки столбиком у правого края. Подойдёт, если хочется держать запасы отдельно от оружия, всегда на одном месте.","Особый приём (перезарядка)","Значок","Значок с надписью «ПКМ» или секундами до готовности. Подойдёт, если нужен самый компактный вариант.","ПКМ</span>","Круг","Круг, который заполняется по мере перезарядки. Подойдёт, если проще следить за кругом, чем читать секунды.","Узкая полоса с заполнением и числом. Подойдёт, если нужно и видеть, насколько близка готовность, и знать точное время.","Вокруг героя","Кольцо на земле вокруг героя, за ним и за врагами, пока приём перезаряжается. Подойдёт, если не хочется искать значок в углу.","Журнал сообщений","Сообщения над оружием, как обычно. Подойдёт, если привык читать их внизу.","У левого края","Сообщения у левого края посередине. Подойдёт, если нижний левый угол хочется оставить для значков.","Две последние","Только два последних сообщения, мелким шрифтом. Подойдёт, если не нужен лишний текст перед глазами.","<div class=\"rl\"><small>Ур.</small><b></b></div>"," · опыт ","<b></b></div><div class=\"ks\"><u>Лук</u>","<b></b></div><small>ПКМ</small>","[свой интерфейс]","Свой интерфейс","<header><div><h2>Свой интерфейс</h2><div class=\"hc-st\">Шаг ","Развернуть","<div class=\"hc-body\"><p class=\"hc-sub\">Выбери, как показывать этот значок. Всё сразу меняется на экране; если панель мешает смотреть, нажми «Свернуть».</p>",">◂ Назад</button><button class=\"btn\" type=\"button\" data-noic data-a=\"cancel\">Отмена</button><span class=\"sp\"></span>","<button class=\"btn\" type=\"button\" data-noic data-a=\"reset\">Сбросить всё</button><button class=\"btn primary\" type=\"button\" data-noic data-a=\"next\">","Готово ✓","Вы нашли зелье лечения.","Стрелы: +6.","Для приёма нужно больше стрел.","<div class=\"ho-card\" role=\"dialog\" aria-modal=\"true\"><h2>Хотите ли попробовать пересобрать интерфейс под себя?</h2>","<p>Можно выбрать, как будут выглядеть здоровье, опыт, золото, оружие, перезарядка и другие значки на экране. Это займёт около минуты. Потом всё можно поменять кнопкой «Свой интерфейс» в верхней панели.</p>","<div class=\"ho-act\"><button class=\"btn primary\" type=\"button\" data-noic data-a=\"y\">Да, попробовать</button><button class=\"btn\" type=\"button\" data-noic data-a=\"n\">Нет, оставить как есть</button></div></div>","Добыча сокровищницы пропадёт, если вы погибнете на этом этаже.","Добыча сокровищницы пропала: вы погибли на этом этаже.","Кузнец отказывается: «Перековка не более 120 раз».","Чит принят.","не менее ","не более ","зачищено этажей","пропущено этажей","этажей пройдено","убито из лука","убийств из лука не менее чем вдвое больше ближних","убито в ближнем бою","убийств в ближнем бою не менее чем втрое больше лучных","смертей","использовано зелий","игра без ранений (охотник)","добыто трофеев охоты","построено зданий","менее 3","золота","покупок","часовня и 2+ благословения","не должно быть обоих","часовня","нет часовни",", благословений: ","реликвия не доведена до +16","макс. заточка менее 16","заточек","построена часовня","благосл
